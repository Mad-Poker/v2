<script>
'use strict';
/* ============================================================
   БЕЗУМНЫЙ ПОКЕР ·Responsive rebuild
   Логика та же. Интерфейс — динамический: все координаты
   считаются из реального размера окна (CSS-пиксели),
   два режима компоновки: вертикальный (телефон) и горизонтальный.
   ============================================================ */

/* ================= УТИЛИТЫ ================= */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
const $=id=>document.getElementById(id);

/* ================= ВИД / ХОЛСТ ================= */
const cv=$('cv');
let mainCtx=cv.getContext('2d',{alpha:false});
let ctx=mainCtx;
/* сцена рисуется в offscreen-буфер: bloom читает его, а не экранный
   холст — нет принудительного флеша GPU, плюс глитч-срезы работают корректно */
const sceneCv=document.createElement('canvas');
let sctx=sceneCv.getContext('2d',{alpha:false});
const IS_TOUCH=('ontouchstart'in window)||navigator.maxTouchPoints>0;
const CAN_HOVER=!!(window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches);
const REDUCED_MOTION=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
let W=360,H=640,DPR=1,L=null,SAFE={t:0,b:0,l:0,r:0};
let CLEANFX=false;
let QUALITY=REDUCED_MOTION?0.55:1;      // авто-качество (частицы/постэффекты)
let AUTOQ=true;                         // false в тестовом режиме (fit=…)
try{if(localStorage.getItem('bp_fx')==='lite')QUALITY=0.45;}catch(e){}

function readSafe(){
  try{
    const cs=getComputedStyle($('probe'));
    SAFE={t:parseFloat(cs.paddingTop)||0,b:parseFloat(cs.paddingBottom)||0,
          l:parseFloat(cs.paddingLeft)||0,r:parseFloat(cs.paddingRight)||0};
  }catch(e){SAFE={t:0,b:0,l:0,r:0};}
}
function resize(){
  readSafe();
  W=Math.max(300,Math.round(window.innerWidth||document.documentElement.clientWidth||360));
  H=Math.max(320,Math.round(window.innerHeight||document.documentElement.clientHeight||640));
  DPR=Math.min(window.devicePixelRatio||1, W*H>2200000?1.5:2);
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  sceneCv.width=cv.width;sceneCv.height=cv.height;
  sctx=sceneCv.getContext('2d',{alpha:false});
  ctx=mainCtx;
  L=buildLayout(W,H);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  seedFloaters();
  // прямо сейчас пересадить животных/частицы в новую геометрию
  G.roster&&G.roster();
}
let resizeT=null;
function onWinResize(){clearTimeout(resizeT);resizeT=setTimeout(resize,60);}
window.addEventListener('resize',onWinResize);
window.addEventListener('orientationchange',()=>{setTimeout(resize,120);setTimeout(resize,420);});
if(window.visualViewport)window.visualViewport.addEventListener('resize',onWinResize);

/* ================= ЛАЙАУТ (ВСЕ ЯКОРИ ЗДЕСЬ) =================
   Два режима: portrait (H >= W*1.05) и landscape.
   S — множитель типографики/иконнок, считается из минимальной стороны.
   ============================================================ */
function buildLayout(vw,vh){
  const W=vw,H=vh;                 // локальные размеры: никаких глобальных W/H
  const portrait=H>=W*1.05;
  const S=clamp(Math.sqrt(Math.min(W,H)/400),0.9,1.45);
  const fs=px=>Math.max(8,Math.round(px*S));           // шрифт из «дизайн-px»
  const st=Math.round(SAFE.t),sb=Math.round(SAFE.b),sl=Math.round(SAFE.l),sr=Math.round(SAFE.r);
  const minTap=IS_TOUCH?44:0;

  /* --- верхняя панель + (в портрете) строка статусов --- */
  const tb=st+Math.round(clamp(48*S,44,68));
  const strip=portrait?Math.round(clamp(30*S,26,40)):0;
  const hudTop=tb+strip;

  /* --- нижняя панель действий: набор рядов --- */
  const squeeze=vh<560;
  let rows;
  if(portrait){
    const r1=Math.round(clamp((squeeze?30:38)*S,26,48));
    const r2=Math.max(squeeze?40:minTap,Math.round(clamp(48*S,38,62)));
    const r3=Math.max(squeeze?44:minTap,Math.round(clamp(54*S,42,66)));
    rows=[
      {h:r1,items:[{k:'hint',w:1},{k:'turtle',w:1},{k:'cheatsBtn',w:1},{k:'chaosBtn',w:1.7}]},
      {h:r2,items:[{k:'pass',w:1},{k:'call',w:1.35},{k:'raise',w:1.35}]},
      {h:r3,items:[{k:'allin',w:1},{k:'fold',w:1}]}
    ];
  }else if(vw>=820&&!squeeze){
    const r=Math.max(minTap,Math.round(clamp(54*S,44,66)));
    rows=[{h:r,items:[{k:'pass',w:1},{k:'call',w:1.3},{k:'raise',w:1.3},{k:'allin',w:1.25},
                    {k:'fold',w:1.2},{k:'hint',w:.58},{k:'turtle',w:.58},{k:'cheatsBtn',w:.58},{k:'chaosBtn',w:1.15}]}];
  }else{
    const r=Math.max(squeeze?36:minTap,Math.round(clamp(44*S,34,52)));
    rows=[
      {h:r,items:[{k:'pass',w:1},{k:'call',w:1.25},{k:'raise',w:1.25},{k:'allin',w:1.2}]},
      {h:r,items:[{k:'fold',w:1.35},{k:'hint',w:.8},{k:'turtle',w:.8},{k:'cheatsBtn',w:.8},{k:'chaosBtn',w:1.25}]}
    ];
  }
  const rgap=Math.round(clamp(6*S,4,8)),rpad=Math.round(clamp(8*S,5,10));
  const tickerH=Math.round(clamp(20*S,15,24));       // бегущая строка всегда внизу
  let ab=sb+rpad*2+tickerH+Math.round(5*S);rows.forEach((r,i)=>ab+=r.h+(i?rgap:0));
  const blockTop=H-ab+rpad;
  const tickerY=blockTop+Math.round(tickerH/2);
  const rowTop=blockTop+tickerH+Math.round(5*S);
  let acc=rowTop;
  rows.forEach(r=>{
    r.y=acc;acc+=r.h;
    const tw=r.items.reduce((s,it)=>s+it.w,0);
    const gapI=Math.round(clamp(6*S,3,8));
    let x=sl+6;
    const usable=W-sl-sr-12-gapI*(r.items.length-1);
    r.items.forEach(it=>{
      it.w2=Math.max(26,usable*it.w/tw);it.x=x;it.y=r.y;it.h=r.h;x+=it.w2+gapI;
    });
  });

  /* --- сколько высоты осталось на сам стол --- */
  const tight=(H-hudTop-ab)<340;
  const compact=tight;
  const plaqueInline=portrait||compact;
  const plaqueH=Math.round(clamp((plaqueInline?(compact?26:40):58)*S,22,74));
  const plaque=plaqueInline?{x:sl+6,y:hudTop+Math.round(4*S),w:W-sl-sr-12,h:plaqueH,inline:true}
                           :{x:sl+12,y:hudTop+Math.round(8*S),w:Math.round(clamp(300*S,190,360)),h:plaqueH,inline:false};
  const freeH=Math.max(120,H-hudTop-ab-plaqueH-Math.round(20*S));
  const flowTop=hudTop+plaqueH+Math.round(14*S);

  /* --- места соперников ---
     на широком экране («rim») персонажи садятся вокруг стола и
     перекрывают сукно — стол и лица становятся крупнее ---------- */
  const rim=!portrait&&!compact;
  const fanBehind=compact||rim;
  const seatDiv=compact?3.5:5.4;
  let botR=rim?Math.round(clamp(34*S,24,60))
              :Math.round(clamp(Math.min(30*S,(freeH*(compact?0.30:0.34))/seatDiv),12,40));
  let bcw=Math.round(clamp(botR*1.15,10,36)),bch=Math.round(bcw*1.42);
  const botTextH=Math.round(clamp(32*S,24,44));
  const botsStackH=rim?Math.round(botR*1.1):Math.round(botR*3.1)+botTextH+(compact?Math.round(2*S):bch+Math.round(6*S));
  const botsTop=flowTop,botsBottom=botsTop+botsStackH;
  const seats=[null,null,null,null];
  if(!rim){
    if(portrait){for(let i=1;i<=3;i++)seats[i]={x:W*(i/4),y:botsTop+botR*1.5,r:botR};}
    else{
      const spread=Math.min(W*0.34,420*S);
      seats[1]={x:W/2-spread,y:botsTop+botR*1.5,r:botR};
      seats[2]={x:W/2,y:botsTop+botR*1.42,r:botR};
      seats[3]={x:W/2+spread,y:botsTop+botR*1.5,r:botR};
    }
  }

  /* --- своя рука: сначала по ширине, потом по остатку высоты --- */
  const meR=Math.round(clamp(Math.min(30*S,botR*1.25),14,40));
  const handPad=Math.round(clamp(44*S,30,58));
  const handX0=sl+10+Math.round(meR*2.6)+Math.round(clamp(8*S,4,12));
  const handW=Math.max(60,W-handX0-sr-12);
  const maxCW=Math.min(104,Math.round(80*S));
  const tableWant=Math.round(clamp(freeH*(compact?0.18:0.30),compact?40:50,230));
  const handAvail=Math.max(44,freeH-botsStackH-tableWant-Math.round(22*S));
  const cwByW=handW/(5+4*0.17),cwByH=(handAvail-handPad)/1.42;
  let hcw=Math.floor(clamp(Math.min(cwByW,cwByH,maxCW),14,maxCW));
  let hch=Math.round(hcw*1.42);
  const gap1=Math.round(clamp(8*S,3,12)),gap2=Math.round(clamp(6*S,3,10));
  let handBandH=hch+handPad,handY=H-ab-gap1-handBandH;
  let top=botsBottom+gap1,bot=handY-gap2,availH=bot-top;
  if(availH<tableWant){                       // столу нужен минимум — ужимаем руку
    const need=Math.min(tableWant-availH,hch*0.5);
    hch=Math.max(24,Math.round(hch-need));hcw=Math.round(hch/1.42);
    handBandH=hch+handPad;handY=H-ab-gap1-handBandH;
    top=botsBottom+gap1;bot=handY-gap2;availH=Math.max(46,bot-top);
  }
  const cx=W/2,cy=top+availH/2;
  const rx=Math.min((W-sl-sr)/2-6,Math.max(70,availH*(rim?1.55:1.2)));
  const ry=Math.min(availH*(rim?0.48:0.46),rx*0.62);
  if(rim){
    botR=Math.round(clamp(Math.min(ry*0.62,rx*0.17,56*S),26,78));
    bcw=Math.round(clamp(botR*1.0,12,40));bch=Math.round(bcw*1.42);
    seats[1]={x:cx-rx*0.68,y:cy-ry*0.46,r:botR};
    seats[2]={x:cx,y:cy-ry*0.74,r:Math.round(botR*0.94)};
    seats[3]={x:cx+rx*0.68,y:cy-ry*0.46,r:botR};
  }
  const gap=Math.round(clamp(hcw*0.17,3,16));
  seats[0]={x:sl+10+Math.round(meR*1.25),y:handY+hch*0.44,r:meR};
  const hand={cw:hcw,ch:hch,gap,y:handY,cx:handX0+handW/2,labelY:handY+hch+Math.round(13*S)};

  /* --- банк, шляпа, колода: всё привязано к эллипсу стола,
         поэтому при любом размере окна шляпа сидит на сукне и не гуляет --- */
  const pot={x:cx,y:cy+ry*(rim?0.52:0.3)};
  const hatS=clamp(0.42+ry*0.014,0.62,1.15);
  const hat={x:cx-rx*(rim?0.62:0.5),y:cy+ry*(rim?0.14:0.04),s:hatS};
  const deck={x:hat.x+Math.round(48*hatS),y:hat.y-Math.round(5*S)};

  /* --- прочая мелочь --- */
  const ticker={y:tickerY,h:tickerH};
  const bannerY=Math.max(hudTop+Math.round(26*S),cy-ry*0.55);
  const chaos=portrait?null:{x:W-sr-Math.round(20*S),y:plaque.y+plaque.h+Math.round(10*S),
    w:Math.round(clamp(18*S,12,22)),
    h:Math.max(60,handY-Math.round(64*S)-(plaque.y+plaque.h+Math.round(10*S)))};
  const sparkOn=!portrait&&!compact&&W>=860&&availH>170;
  const spark={x:sl+14,y:cy+ry*0.1,w:Math.round(clamp(170*S,110,200)),h:Math.round(clamp(48*S,34,60))};
  const panelW=Math.min(W-Math.round(24*S),Math.round(820*S));
  const panelH=Math.min(H-Math.round(36*S),Math.round(640*S));

  return {W:vw,H:vh,S,fs,portrait,compact,rim,fanBehind,minTap,st,sb,sl,sr,tb,strip,hudTop,rows,ab,rowTop,
          plaque,seats,botR,bcw,bch,botsTop,botsBottom,botTextH,meR,hand,handBandH,handY,
          table:{cx,cy,rx,ry,top,bot,availH},pot,hat,deck,ticker,bannerY,
          chaos,sparkOn,spark,panelW,panelH,cx,cy};
}

/* ================= ЗВУК ================= */
let AC=null,muted=false;
try{muted=localStorage.getItem('bp_mute')==='1';}catch(e){}
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}
  return AC;
}
function tone(f,d,type,vol,fEnd,delay){
  if(muted)return;const a=ac();if(!a)return;
  try{
    const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(Math.max(1,f),t0);
    if(fEnd)o.frequency.exponentialRampToValueAtTime(Math.max(1,fEnd),t0+d);
    g.gain.setValueAtTime(Math.min(vol||0.07,0.2),t0);g.gain.exponentialRampToValueAtTime(0.001,t0+d);
    o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+0.06);
  }catch(e){}
}
function noise(d,vol,fq,delay){
  if(muted)return;const a=ac();if(!a)return;
  try{
    const t0=a.currentTime+(delay||0),len=Math.max(8,Math.floor(a.sampleRate*d));
    const buf=a.createBuffer(1,len,a.sampleRate),dat=buf.getChannelData(0);
    for(let i=0;i<dat.length;i++)dat[i]=Math.random()*2-1;
    const s=a.createBufferSource();s.buffer=buf;
    const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||900;
    const g=a.createGain();g.gain.setValueAtTime(Math.min(vol||0.12,0.3),t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+d);
    s.connect(f);f.connect(g);g.connect(a.destination);s.start(t0);
  }catch(e){}
}
function buzz(ms){if(IS_TOUCH&&navigator.vibrate){try{navigator.vibrate(ms);}catch(e){}}}
const snd={
  pop:()=>tone(880,0.04,'sine',0.05,1300),
  chip:()=>{noise(0.07,0.12,2600);tone(1200,0.06,'triangle',0.06,900,0.03);},
  coin:()=>{tone(988,0.08,'square',0.06);tone(1319,0.25,'square',0.06,null,0.08);},
  fart:()=>{tone(150,0.45,'sawtooth',0.14,40);noise(0.35,0.09,280);},
  crow:()=>{[0,0.22,0.44,0.78].forEach((d,i)=>{tone(650+i*90,0.18,'sawtooth',0.11,1250+i*120,d);noise(0.05,0.04,3000,d);});},
  meow:()=>{tone(700,0.4,'sine',0.1,420);tone(430,0.25,'sine',0.08,300,0.35);},
  heehaw:()=>{tone(220,0.3,'sawtooth',0.13,110);tone(160,0.45,'sawtooth',0.13,80,0.32);},
  ratchet:()=>noise(0.03,0.08,4000),
  fanfare:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.2,'square',0.08,null,i*0.12));},
  lose:()=>{[392,370,349,311].forEach((f,i)=>tone(f,0.3,'sawtooth',0.07,f*0.93,i*0.24));},
  glitch:()=>{for(let i=0;i<8;i++)tone(rnd(200,3200),0.05,'sawtooth',0.05,null,i*0.04);},
  boom:()=>{noise(0.5,0.3,180);tone(80,0.5,'sine',0.22,28);},
  allin:()=>{tone(300,0.5,'sawtooth',0.13,950);noise(0.4,0.14,4200);tone(950,0.3,'square',0.08,1500,0.3);},
  egg:()=>{tone(500,0.15,'sine',0.09,1400);tone(1400,0.2,'sine',0.07,2000,0.12);},
  disco:()=>{[0,0.15,0.3,0.45].forEach((d,i)=>tone([262,330,392,523][i],0.14,'square',0.05,null,d));}
};

  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function sweatDrop(x,y,s,al){
  ctx.save();ctx.globalAlpha=al;

}
function tearDrop(x,y,s,al){
  ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);
  P();ctx.moveTo(0,-s);ctx.quadraticCurveTo(s*0.7,0,0,s*0.8);ctx.quadraticCurveTo(-s*0.7,0,0,-s);
  fill('#bfe8ff');ctx.restore();
}
function angerMark(x,y,s,al){
  ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.strokeStyle='#ff2e88';ctx.lineWidth=s*0.4;ctx.lineCap='round';
  P();ctx.moveTo(0,-s);ctx.lineTo(0,s);ctx.moveTo(-s,0);ctx.lineTo(s,0);
  P();ctx.moveTo(-s*0.7,-s*0.7);ctx.lineTo(s*0.7,s*0.7);ctx.moveTo(s*0.7,-s*0.7);ctx.lineTo(-s*0.7,s*0.7);
  ctx.stroke();ctx.restore();

/* ---------- сцена под персонажем (без кружка: пол + мягкий свет) ---------- */
function hexA(hex,a){
  const c=hex.length===4?'#'+hex[1]+hex[1]+hex[2]+hex[2]+hex[3]+hex[3]:hex;
  return 'rgba('+parseInt(c.substr(1,2),16)+','+parseInt(c.substr(3,2),16)+','+parseInt(c.substr(5,2),16)+','+a+')';
}
function avatarStage(x,y,r,accent,state,t){
  ctx.save();
  const g=ctx.createRadialGradient(x,y+r*1.02,r*0.05,x,y+r*1.02,r*1.15);
  g.addColorStop(0,'rgba(0,0,0,.6)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;P();ctx.ellipse(x,y+r*1.04,r*1.05,r*0.26,0,0,TAU);ctx.fill();
  if(state==='turn'||state==='allin'){
    const c=state==='allin'?TH.rose:accent;
    const p=0.55+0.45*Math.sin(t*(state==='allin'?5.2:3));
    const g2=ctx.createRadialGradient(x,y+r*0.1,r*0.2,x,y+r*0.1,r*1.85);
    g2.addColorStop(0,hexA(c,0.26*p));g2.addColorStop(0.55,hexA(c,0.09*p));g2.addColorStop(1,hexA(c,0));
    ctx.fillStyle=g2;P();ctx.ellipse(x,y+r*0.1,r*1.45,r*1.6,0,0,TAU);ctx.fill();
    if(state==='allin'){                        // искры ванинга
      ctx.strokeStyle=hexA(c,0.5);ctx.lineWidth=Math.max(1,r*0.035);
      for(let i=0;i<5;i++){const a=t*1.6+i*TAU/5,rr2=r*(1.25+0.12*Math.sin(t*3+i));
        P();ctx.moveTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2*0.75);
        ctx.lineTo(x+Math.cos(a)*rr2*1.16,y+Math.sin(a)*rr2*0.87);ctx.stroke();}
    }
  }
  ctx.restore();
}
/* «ободковый» свет по контуру головы — современный rim light */
function rimLight(cx,cy,rx,ry,color,alpha){
  ctx.save();ctx.globalAlpha=alpha||0.5;
  P();ctx.ellipse(cx,cy,rx,ry,0,Math.PI*0.85,Math.PI*1.75);
  ctx.strokeStyle=color;ctx.lineWidth=rx*0.13;ctx.lineCap='round';ctx.stroke();
  ctx.restore();
}
/* стопка фишек — общий проп для «игроков» */
function chipStack(x,y,s,cols,n){
  for(let i=0;i<n;i++){
    const yy=y-i*s*0.42,wob=Math.sin(x*0.7+i*1.3)*s*0.06;
    P();ctx.ellipse(x+wob,yy,s*0.62,s*0.24,0,0,TAU);
    ctx.fillStyle=cols[i%cols.length];ctx.fill();
    P();ctx.ellipse(x+wob,yy-s*0.09,s*0.62,s*0.24,0,0,TAU);
    ctx.fillStyle=cols[i%cols.length];ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.45)';ctx.lineWidth=s*0.06;ctx.stroke();
    P();ctx.ellipse(x+wob,yy-s*0.09,s*0.3,s*0.11,0,0,TAU);
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.fill();
  }
}

/* ============================================================
   «ГРЯЗНЫЙ СКЕТЧ»: дрожащая линия (boil), смещение красочного
   слоя относительно контура (misregistration), штриховка вместо
   градиентов, кривая анатомия. Юнит-пространство: радиус = 100.
   ============================================================ */
function rp(pts,seed,amp){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    const a=pts[i][0]+jv(seed+i*2,amp),b=pts[i][1]+jv(seed+i*2+1,amp);
    i?ctx.lineTo(a,b):ctx.moveTo(a,b);
  }
  ctx.closePath();
}
function rBlob(cx,cy,rx,ry,rot,seed,irr){
  const n=13,pts=[];
  for(let i=0;i<n;i++){
    const a=i/n*TAU+(rot||0);
    const k=1+((h1(seed+i*3.3)-0.5)*(irr===undefined?0.14:irr));
    pts.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k]);
  }
  rp(pts,seed+50,2.2);
}
function rInk(w,col){
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle=col||'#0b0710';ctx.lineWidth=w||3.2;ctx.stroke();
  ctx.globalAlpha=0.45;ctx.lineWidth=Math.max(1,(w||3.2)*0.45);
  ctx.save();ctx.translate(jv(91,2.4),jv(77,2.4));ctx.stroke();ctx.restore();
  ctx.globalAlpha=1;
}
/* цветная «плашка» со смещением + кривой контур */
function rShape(pts,fill,seed,inkW,mis){
  const m=mis===undefined?3:mis;
  if(fill){
    ctx.save();ctx.translate(m,-m*0.7);ctx.globalAlpha=0.92;
    rp(pts,seed+31,2.4);ctx.fillStyle=fill;ctx.fill();ctx.restore();
  }
  rp(pts,seed,2.4);rInk(inkW);
}
function rEllipse(cx,cy,rx,ry,rot,fill,seed,inkW,mis){
  const m=mis===undefined?3:mis;
  if(fill){
    ctx.save();ctx.translate(m,-m*0.7);ctx.globalAlpha=0.92;
    rBlob(cx,cy,rx,ry,rot,seed,0.1);ctx.fillStyle=fill;ctx.fill();ctx.restore();
  }
  rBlob(cx,cy,rx,ry,rot,seed,0.1);rInk(inkW);
}
function rLine(x1,y1,x2,y2,w,col,seed){
  ctx.beginPath();
  const n=4;
  for(let i=0;i<=n;i++){
    const t=i/n,x=x1+(x2-x1)*t+jv(seed+i,2.6),y=y1+(y2-y1)*t+jv(seed+i+11,2.6);
    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.lineCap='round';ctx.strokeStyle=col||'#0b0710';ctx.lineWidth=w||3;ctx.stroke();
}
function rCurve(x1,y1,cx,cy,x2,y2,w,col,seed){
  ctx.beginPath();ctx.moveTo(x1+jv(seed,2),y1+jv(seed+1,2));
  ctx.quadraticCurveTo(cx+jv(seed+2,3),cy+jv(seed+3,3),x2+jv(seed+4,2),y2+jv(seed+5,2));
  ctx.lineCap='round';ctx.strokeStyle=col||'#0b0710';ctx.lineWidth=w||3;ctx.stroke();
}
/* клин «шея→плечи»: заполняет пустоту между головой и туловищем */
function rTraps(nw,ny,spread,sy,color,seed){
  rShape([[-nw,ny],[-nw-5,ny+11],[-nw-spread,sy+2],[-nw-spread+3,sy+20],
          [nw+spread-3,sy+20],[nw+spread,sy+2],[nw+5,ny+11],[nw,ny]],color,seed,0,0);
}
function rHatch(x,y,w,h,ang,gap,col,al){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.globalAlpha=al||0.25;ctx.strokeStyle=col||'#0b0710';ctx.lineWidth=1.6;
  ctx.translate(x,y);ctx.rotate(ang||0.7);
  ctx.beginPath();
  for(let i=-h;i<w+h;i+=(gap||7)){ctx.moveTo(i,0);ctx.lineTo(i+h,h);}
  ctx.stroke();ctx.restore();
}
function rSplat(x,y,r,seed,col){
  ctx.fillStyle=col||'rgba(11,7,16,.5)';
  for(let i=0;i<5;i++){
    const a=h1(seed+i)*TAU,d=r*(0.4+h1(seed+i*2.3));
    ctx.beginPath();
    ctx.ellipse(x+Math.cos(a)*d,y+Math.sin(a)*d,r*0.22*(0.5+h1(seed+i*5)),r*0.18*(0.5+h1(seed+i*7)),a,0,TAU);
    ctx.fill();
  }
}
function rEye(x,y,r,open,look,col,seed){
  rEllipse(x,y,r,r*Math.max(0.16,open),0,'#f4f1e8',seed,2.6,2);
  if(open>0.3){
    ctx.save();
    ctx.beginPath();ctx.arc(x+(look?look[0]:0),y+(look?look[1]:0),r*0.52,0,TAU);
    ctx.fillStyle=col||'#1a1420';ctx.fill();
    ctx.fillStyle='#f4f1e8';ctx.beginPath();
    ctx.arc(x-1.6,y-2.2,r*0.17,0,TAU);ctx.fill();
    ctx.restore();
  }
}
function rMouth(x,y,w,curve,col,seed,lw){
  ctx.beginPath();
  const n=6;
  for(let i=0;i<=n;i++){
    const t=i/n*2-1,px=x+w*t,py=y+curve*(1-t*t)*Math.sign(curve||1)+jv(seed+i,1.6);
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.strokeStyle=col||'#0b0710';ctx.lineWidth=lw||3.4;ctx.lineCap='round';ctx.stroke();
}

/* ---------- ТЫ: тип в очках, нарисованный «на коленке» ---------- */

  }else if(mood==='win'){rMouth(0,10,17,12,'#0b0710',S+140,3.6);
    ctx.save();ctx.fillStyle='#f4f1e8';ctx.beginPath();
    ctx.moveTo(-13,11);ctx.quadraticCurveTo(0,22,13,11);ctx.closePath();ctx.fill();ctx.restore();}
  else if(mood==='talk')rEllipse(0,15,10,5+Math.sin(t*13)*3.4,0,'#3a1220',S+144,2.6,2);

function star(t,x,y,r,col,seed){
  ctx.save();ctx.translate(x,y);ctx.rotate(t*1.9);
  rp(Array.from({length:10},(_,i)=>{const a=i*Math.PI/5,rr2=i%2?r*0.42:r;

  ctx.fillStyle=col;ctx.fill();rInk(1.8);ctx.restore();
}
function drop(x,y,r,col){
  rp([[x,y-r*1.7],[x+r*0.85,y-r*0.1],[x+r*0.3,y+r*0.8],[x-r*0.4,y+r*0.7],[x-r*0.85,y-r*0.2]],x+y,1.4);

function angryMark(x,y,r,seed){

function chipRough(x,y,r,seed){

    rEllipse(x+jv(seed+i,2),y-i*r*0.5,r,r*0.42,0,cols[i],seed+i*3,2.2,2);

/* ---------- КРИПТО-ХОМЯК ---------- */
function charHamster(t,mood,seed){
  const jit=mood==='sweat'?Math.sin(t*22)*2:0,S=seed*17.1;

const CHAR_DRAW={hero:charHero,ogre:charOgre,hamster:charHamster,ex:charEx};
function drawCharacter(kind,x,y,r,t,mood,seed){
  ctx.save();
  const w=r*2.9,c=r*0.5,top=y-r*1.62,bot=y+r*1.78;
  ctx.beginPath();
  ctx.moveTo(x-w/2+c,top);
  ctx.lineTo(x+w/2-c,top);
  ctx.lineTo(x+w/2,top+c*0.7);
  ctx.lineTo(x+w/2,bot);
  ctx.lineTo(x-w/2,bot);
  ctx.lineTo(x-w/2,top+c*0.7);
  ctx.closePath();ctx.clip();
  ctx.translate(x,y+r*0.06);
  const k=r/100;ctx.scale(k,k);
  ctx.lineJoin='round';ctx.lineCap='round';
  (CHAR_DRAW[kind]||charHero)(t,mood,seed||1);
  ctx.restore();
}

  const wg=ctx.createLinearGradient(-18,0,10,10);wg.addColorStop(0,'#00fff7');wg.addColorStop(1,'#2a1540');
  ctx.fillStyle=wg;ctx.shadowColor='#00fff7';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
  stroke('#00fff7',2);
  stroke('rgba(0,0,0,0.35)',1.4);
  P();ctx.moveTo(-14,4);ctx.lineTo(-4,7);ctx.moveTo(-12,8);ctx.lineTo(-2,10);ctx.stroke();
  ctx.restore();
  // шея + голова
  const headX=crowing?8:17,headY=crowing?-33:-22;

  ctx.shadowBlur=0;
  // серёжка
  ctx.fillStyle='#ff2244';
  P();ctx.ellipse(headX+3,headY+9+Math.sin(t*6)*1.2,3,5,0,0,TAU);ctx.fill();

    P();ctx.ellipse(0,-15,2.8,12,0,0,TAU);ctx.fillStyle='#ff9be8';ctx.fill();
    ctx.restore();
  });
  // грива
  stroke('#ff2e88',3.4);ctx.shadowColor='#ff2e88';ctx.shadowBlur=7;
  for(let i=0;i<4;i++){P();ctx.moveTo(-6+i*6,-18);ctx.lineTo(-11+i*6+Math.sin(t*4+i)*3,-32);ctx.stroke();}
  ctx.shadowBlur=0;
  // глаз
  const bl=eyeOpen(t,0.7);
  P();ctx.arc(14,-13,4.6,0,TAU);fill('#fff');
  P();ctx.arc(15.5,-13,2.4*Math.max(0.2,bl),0,TAU);fill('#000');
  P();ctx.arc(14,-15,1,0,TAU);fill('#fff');
  ctx.restore();
  // баббл
  if(peek>0.8&&line){
    const bx=side==='left'?x+70*sc:x-70*sc;
    drawBubble(bx-92,y-96,line,184,'#ffe14d');

  if(pizzaObj){

    ctx.save();ctx.font=Math.round(30*sc)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🍕',lerp(pizzaObj.x,pizzaObj.tx,k),lerp(pizzaObj.y,pizzaObj.ty,k)-Math.sin(k*Math.PI)*80);

}

/* ================= КАРТЫ / ОЦЕНКА ================= */
function mkDeck(){const d=[];for(let r=2;r<=14;r++)for(let s=0;s<4;s++)d.push({rank:r,suit:s,wild:false});return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newCard(){return{rank:2+ri(0,12),suit:ri(0,3),wild:false};}
function scoreReal5(cs){
  const r=cs.map(c=>c.rank).sort((a,b)=>b-a),counts={};
  r.forEach(v=>counts[v]=(counts[v]||0)+1);
  const groups=Object.keys(counts).map(v=>({v:+v,c:counts[v]})).sort((a,b)=>b.c-a.c||b.v-a.v);
  const flush=cs.every(c=>c.suit===cs[0].suit);
  const uniq=[...new Set(r)];let sHigh=0;
  if(uniq.length===5){if(uniq[0]-uniq[4]===4)sHigh=uniq[0];else if(uniq.join(',')==='14,5,4,3,2')sHigh=5;}
  if(flush&&sHigh)return[8,sHigh];
  if(groups[0].c===4)return[7,groups[0].v,groups[1].v];
  if(groups[0].c===3&&groups[1].c===2)return[6,groups[0].v,groups[1].v];
  if(flush)return[5,...r];
  if(sHigh)return[4,sHigh];
  if(groups[0].c===3)return[3,groups[0].v,groups[1].v,groups[2].v];
  if(groups[0].c===2&&groups[1].c===2)return[2,groups[0].v,groups[1].v,groups[2].v];
  if(groups[0].c===2)return[1,groups[0].v,groups[1].v,groups[2].v];
  return[0,...r];
}
function cmpScore(a,b){const n=Math.max(a.length,b.length);for(let i=0;i<n;i++){const d=(a[i]||0)-(b[i]||0);if(d)return d;}return 0;}
function score5(cs){
  const w=cs.filter(c=>c.wild);let real=cs.filter(c=>!c.wild);
  const wn=Math.min(w.length,2);
  for(let i=2;i<w.length;i++)real.push({rank:14,suit:0});
  if(wn===0)return scoreReal5(real);
  const opts=[];for(let r=2;r<=14;r++)for(let s=0;s<4;s++)opts.push({rank:r,suit:s});
  let best=null;
  if(wn===1){for(const o of opts){const sc=scoreReal5(real.concat(o));if(!best||cmpScore(sc,best)>0)best=sc;}}
  else{for(const o1 of opts)for(const o2 of opts){const sc=scoreReal5(real.concat(o1,o2));if(!best||cmpScore(sc,best)>0)best=sc;}}
  return best;
}
function evalHand(cards){const cs=cards.slice();while(cs.length<5)cs.push({rank:2,suit:0,pad:true});return score5(cs);}
function comboName(cards){const sc=evalHand(cards);let n=CAT_NAMES[sc[0]]||'?';if(cards.some(c=>c.wild))n+=' 🍌';return n;}
function scoreFast(cs){
  const a=cs.map(c=>c.wild?{rank:14,suit:(c.suit+1)%4}:{rank:c.rank,suit:c.suit});
  while(a.length<5)a.push({rank:2,suit:0});
  return scoreReal5(a);
}
function dealRandom(k){const a=[];for(let i=0;i<k;i++)a.push(newCard());return a;}
/* Монте-Карло: шанс, что твоя рука окажется лучшей */
function estWinProb(){
  const me=players[HUMAN].cards;
  if(!me.length||G.phase==='idle'){G.winP=0.5;return;}
  const bots=players.filter(p=>p.active&&!p.isHuman);
  const need=G.maxRounds,sims=130;let wins=0;
  for(let s=0;s<sims;s++){
    const myS=scoreFast(me.concat(dealRandom(need-me.length)));
    let best=true;
    for(let i=0;i<bots.length;i++){
      const b=bots[i];
      const bs=scoreFast(b.cards.concat(dealRandom(need-b.cards.length)));
      if(cmpScore(bs,myS)>0){best=false;break;}
    }
    if(best)wins++;
  }
  G.winP=bots.length?wins/sims:1;
}
function handStrength(i){
  const p=players[i];if(!p.cards.length)return 0;
  const sc=evalHand(p.cards);
  const base=[0.12,0.3,0.45,0.55,0.65,0.75,0.85,0.95,1][sc[0]];
  return clamp(base+p.cards.length*0.02+Math.random()*0.12,0,1);
}

function runRooster(action,cb){
  const r=G.rooster;
  if(r.mode!=='off'){if(cb)cb();return;}
  r.mode='enter';r.action=action;r.cb=cb;r.t=0;
  r.x=-90;r.y=L.table.top+L.table.ry*0.2;r.bag=false;r.rings=[];

function updateRooster(dt){
  const r=G.rooster;if(r.mode==='off')return;
  const T=L.table;
  const homeX=T.cx,homeY=T.cy-T.ry*0.18;
  r.flap+=dt;r.rings=r.rings.filter(x=>{x.t+=dt;return x.t<0.9;});
  if(r.mode==='enter'){
    r.t+=dt;const k=Math.min(1,r.t/1.3);
    r.x=lerp(-90,homeX,k);r.y=lerp(T.top+T.ry*0.2,homeY,k)+Math.sin(r.t*9)*34*(1-k);
    if(Math.random()<0.4*QUALITY)spawn(r.x-20,r.y+10,['🪶'],1,60,150);
    if(k>=1){r.mode='act';r.t=0;doRoosterAct();}
  }else if(r.mode==='act'){
    r.t+=dt;r.y=homeY+Math.sin(r.t*4)*4;r.x=homeX;
    if(r.action==='crow'&&r.t>0.25&&r.t<0.3)for(let i=0;i<3;i++)ring(r.x+34,r.y-30,'#ff2e88');
    if(r.t>1.9){r.mode='exit';r.t=0;}
  }else if(r.mode==='exit'){
    r.t+=dt;const k=Math.min(1,r.t/1.1);
    r.x=lerp(homeX,W+90,k);
    r.y=r.bag?lerp(homeY,L.H*0.06,k):homeY+Math.sin(r.t*9)*30*k;
    if(Math.random()<0.4*QUALITY)spawn(r.x-20,r.y+10,['🪶'],1,60,150);
    if(k>=1){r.mode='off';if(r.cb){const cb=r.cb;r.cb=null;cb();}}
  }else if(r.mode==='dj'){
    r.t+=dt;r.x=T.cx+T.rx*0.62;r.y=T.cy-T.ry*0.3+Math.abs(Math.sin(r.t*6))*16;
    if(Math.random()<0.25*QUALITY)spawn(r.x+rnd(-40,40),r.y,['✨','🪩','🎵'],1,90,60);

}

function newGame(keepStats){
  G.scene='play';G.round=0;G.pot=0;G.stolenPot=0;G.phase='idle';G.overlay=null;
  G.pizzas=keepStats?G.pizzas:3;G.hints=3;G.chaos=0;G.revealAll=false;G.lastWinner=null;
  G.deck=shuffle(mkDeck());G.flying=[];G.parts=[];G.floats=[];G.banners=[];
  players.forEach((p,i)=>{p.cards=[];p.bet=0;p.active=true;p.acted=false;p.allin=false;p.bubble=null;
    p.mood='idle';p.moodT=0;p.chips=i===HUMAN?(keepStats?players[HUMAN].chips:120):100+ri(0,60);});
  logIt('🎰 <b>ИГРА #'+G.gameNum+'</b> началась. Петух уже вылетел. Обратного билета нет.');
  banner('🐓 БЕЗУМНЫЙ ПОКЕР',L.fs(22));
  snd.fanfare();startRound();
}
function startRound(){
  G.round++;
  if(G.round>G.maxRounds){startShowdown();return;}
  players.forEach(p=>{p.bet=0;p.allin=false;p.acted=false;p.bubble=null;});
  G.deck=shuffle(mkDeck());G.flying=[];
  G.flags={x2:false,lowball:false,whisper:false,drunk:false,tax:false,big:false,invert:false,extraRooster:false,crazySuits:false};
  G.timerMax=60;G.turtleUsed=false;G.chaosUsed=false;
  if(G.round===5&&G.stolenPot>0){
    const back=Math.floor(G.stolenPot*0.6);G.pot+=back;G.stolenPot=0;snd.coin();
    banner('🛡 Страховая «БОЛОТО» вернула '+back+' 🪙',L.fs(15));
    logIt('🛡 Возврат от страховой: '+back+' 🪙. Петух объявлен в розыск. Розыск ведёт тот же петух.');
  }
  G.phase='hat';G.hatT=0;G.rule=null;
  logIt('🎩 <b>РАУНД '+G.round+'</b>. Шляпа крутится... все замерли. Даже хомяк.');
}
function handTarget(i,k,count){
  return i===HUMAN?handCardPos(k,count):botCardPos(i,k,count);
}
function applyRuleAndDeal(){
  G.rule=pick(ROUND_RULES);
  try{G.rule.apply();}catch(e){logIt('🐛 Правило сломалось при применении. Это тоже правило.');}
  banner('🎩 '+G.rule.text,L.fs(G.rule.text.length>34?14:17),3.2);
  logIt('🎩 ПРАВИЛО: <b>'+G.rule.text+'</b>');
  snd.glitch();G.shake=6;addChaos(8);G.flash=0.35;
  if(G.flags.extraRooster)setTimeout(()=>{if(G.scene==='play')runRooster('random');},500);
  const ante=G.flags.tax?20:10;
  players.forEach((p,i)=>{if(p.active){p.chips-=ante;const s=seat(i);
    floatText(s.x,s.y-s.r*1.5,'−'+ante+'🪙','#ff9b9b');}});
  G.pot+=ante*players.filter(p=>p.active).length;snd.chip();
  let d=0;
  players.forEach((p,i)=>{
    if(!p.active)return;
    const c=G.deck.length?G.deck.pop():newCard();
    const tgt=handTarget(i,p.cards.length,p.cards.length+1);
    G.flying.push({card:c,x0:L.deck.x,y0:L.deck.y,x1:tgt.x,y1:tgt.y,t:-d,dur:0.42,owner:i,done:false});
    p.cards.push(c);d+=0.16;
  });
  G.phase='deal';G.phaseT=d+0.55;
  checkBankrupt();estWinProb();
}
function onHumanTurn(){
  G.timeLeft=G.timerMax;buzz(8);
  if(!G.firstHint){G.firstHint=true;banner('ТВОЙ ХОД · кнопки внизу',L.fs(15));}
}
function beginBetting(){
  G.phase='bet';G.currentBet=0;
  players.forEach(p=>{p.bet=0;p.acted=false;});
  const active=players.filter(p=>p.active&&!p.allin);
  if(active.length<=1){endBetting();return;}
  let st=(G.round-1)%4,g=0;
  while(g<8&&!(players[st].active&&!players[st].allin)){st=(st+1)%4;g++;}
  G.actor=st;
  estWinProb();
  if(players[st].isHuman)onHumanTurn();else G.botDelay=rnd(0.9,1.8);
}
function mult(){return G.flags.x2?2:1;}
function potTotal(){return G.pot+players.reduce((s,p)=>s+p.bet,0);}
function act(i,action){
  const p=players[i];
  if(G.phase!=='bet'||G.actor!==i||!p.active)return;
  const toCall=G.currentBet-p.bet,s=seat(i);
  if(action==='timeout'){
    action=toCall>0?'fold':'pass';
    banner('⏰ ВРЕМЯ ВЫШЛО! '+(toCall>0?'Карты съел хомяк. Скинул за тебя.':'Авто-пас. Хомяк доволен.'),L.fs(15));
    snd.fart();
  }
  if(action==='pass'){
    if(toCall>0)return;
    p.acted=true;snd.pop();setMood(i,'idle',1.2);
    if(!p.isHuman&&Math.random()<0.4)say(i,pick(LINES[i].pass));
    logIt('👀 <b>'+p.name+'</b>: пас.');
  }else if(action==='call'){
    const pay=Math.min(p.chips,toCall);p.chips-=pay;p.bet+=pay;
    if(p.chips===0)p.allin=true;p.acted=true;snd.chip();if(p.isHuman)buzz(10);
    spawn(s.x,s.y+20,['🪙'],6,110);setMood(i,toCall>0?'sweat':'idle',2);
    if(!p.isHuman&&Math.random()<0.5)say(i,pick(LINES[i].call));
    logIt('💜 <b>'+p.name+'</b> коллит '+pay+' 🪙.');
  }else if(action==='raise'){
    const amt=10*mult(),pay=Math.min(p.chips,toCall+amt);
    p.chips-=pay;p.bet+=pay;if(p.bet>G.currentBet)G.currentBet=p.bet;
    if(p.chips===0)p.allin=true;p.acted=true;snd.chip();tone(500,0.1,'square',0.07,800);
    if(p.isHuman)buzz(12);
    spawn(s.x,s.y+20,['🪙','📈'],9,150);setMood(i,'cool',2.2);
    if(!p.isHuman&&Math.random()<0.6)say(i,pick(LINES[i].raise));
    logIt('📈 <b>'+p.name+'</b> РЕЙЗИТ до '+G.currentBet+' 🪙!');
  }else if(action==='allin'){
    const pay=p.chips;p.bet+=pay;p.chips=0;p.allin=true;
    if(p.bet>G.currentBet)G.currentBet=p.bet;
    p.acted=true;snd.allin();G.shake=Math.min(14,L.H*0.024);buzz([20,40,20]);
    banner('💥 '+p.name+': ОЛЛ-ИН!!!',L.fs(22));
    spawn(s.x,s.y,['🔥','💥','🪙'],18,260);setMood(i,'rage',4);
    if(!p.isHuman)say(i,pick(LINES[i].allin));
    logIt('💥 <b>'+p.name+'</b> ВА-БАНК. Ставки сделаны, ставок больше нет.');
    addChaos(6);if(p.isHuman){toast('🏅 ДОСТИЖЕНИЕ: «Ва-банкер». Петух впечатлён.');tease('allin',0.55);}
    else tease('allin',0.22);
    react('allinToMe',0.55);
  }else if(action==='fold'){
    p.active=false;p.acted=true;snd.fart();G.shake=5;buzz(14);tease(i===HUMAN?'fold':'botfold',i===HUMAN?0.5:0.2);
    if(i===HUMAN)react('meFold',0.6);
    spawn(s.x,s.y+30,['🗑','💨'],8,140);setMood(i,'sulk',5);
    if(!p.isHuman&&Math.random()<0.6)say(i,pick(LINES[i].fold));
    logIt('🗑 <b>'+p.name+'</b> СКИНУЛ. Карты улетели в мусорку.');
    if(i===HUMAN){
      const bots=players.filter(q=>q.active&&!q.isHuman);
      if(!bots.length){finishGame([HUMAN],'ВСЕ СКИНУЛИ! Победа испугом.');return;}
      const w=pick(bots);say(w.seat,pick(LINES[w.seat].win));setMood(w.seat,'win',4);
      finishGame([w.seat],'🗑 Ты скинул. '+w.name+' забирает банк.');
      snd.lose();return;
    }
  }
  checkBankrupt();advance();
}
function allActed(){return players.every(p=>!p.active||p.acted||p.allin);}
function advance(){
  const act2=players.filter(p=>p.active);
  if(act2.length<=1){
    const w=act2[0];
    if(w&&w.isHuman)finishGame([HUMAN],'🏆 ВСЕ СКИНУЛИ! Ты победил(а) чистым испугом.');
    else if(w){finishGame([w.seat],'Все скинули. '+w.name+' забирает банк.');}
    else finishGame([HUMAN],'🤯 Все скинули одновременно. Петух забирает банк.');
    return;
  }
  if(allActed()){endBetting();return;}
  let k=G.actor,g=0;
  do{k=(k+1)%4;g++;}while(g<8&&!(players[k].active&&!players[k].acted&&!players[k].allin));
  G.actor=k;
  if(players[k].isHuman)onHumanTurn();else G.botDelay=rnd(0.8,1.7)/G.madness;
}
function botAct(i){
  const p=players[i];if(!p.active||G.phase!=='bet'||G.actor!==i)return;
  const toCall=G.currentBet-p.bet,s=handStrength(i);
  let action,line=null;
  if(Math.random()<0.22){
    const opts=['fold'];
    if(toCall===0)opts.push('pass');
    if(p.chips>0)opts.push('call');
    if(p.chips>toCall+10*mult())opts.push('raise');
    opts.push('allin');
    action=pick(opts);
    if(action==='fold'&&toCall===0)line='СКИНУ ПРОСТО ТАК. ПРОВЕРЯЮ РАБОТОСПОСОБНОСТЬ.';
    else if(action==='allin'&&s<0.35)line=pick(LINES[i].allin)+' (У МЕНЯ МУСОР. НО КРАСИВЫЙ.)';
    else if(action==='raise'&&s<0.2)line='РЕЙЗ. Я ДАЖЕ НЕ СМОТРЕЛ НА КАРТЫ. ОНИ МЕНЯ БОЯТСЯ.';
  }else{
    if(toCall===0){action=(p.chips>20&&Math.random()<0.3+s*0.35)?'raise':'pass';}
    else{
      const potOdds=toCall/Math.max(1,potTotal()+toCall);
      if(s>potOdds+0.15+Math.random()*0.2)action=Math.random()<0.3?'allin':'raise';
      else if(s>potOdds-0.12||Math.random()<0.14)action='call';
      else action='fold';
    }
  }
  if(!line){const pool=LINES[i][action==='pass'?'pass':action];if(pool&&Math.random()<0.6)line=pick(pool);}
  if(line)say(i,line);
  act(i,action);
}
function endBetting(){
  G.pot+=players.reduce((s,p)=>s+p.bet,0);
  players.forEach(p=>{p.bet=0;p.acted=false;});
  G.currentBet=0;
  if(G.round>=G.maxRounds){startShowdown();return;}
  G.phase='rooster';
  const roosterActions={1:'crow',2:'egg',3:'peck',4:'steal'};
  const a=roosterActions[G.round]||'crow';
  setTimeout(()=>{if(G.scene==='play')runRooster(a,()=>{if(G.scene==='play')startRound();});},700);
  logIt('🐓 Раунд '+G.round+' закрыт. Банк: '+G.pot+' 🪙. К столу летит ОН.');
  if(G.pot>=120)react('bigPot',0.7);
}
function startShowdown(){
  G.phase='showdown';G.revealAll=true;snd.disco();tease('showdown',0.5);
  const r=G.rooster;r.mode='dj';r.t=0;r.x=L.table.cx+L.table.rx*0.62;r.y=L.table.cy-L.table.ry*0.3;
  banner('🪩 ПЕТУХ-ДИДЖЕЙ. ШОУДАУН-ДИСКО!',L.fs(16));
  const results=[];
  players.forEach((p,i)=>{
    if(!p.active)return;
    const sc=evalHand(p.cards);results.push({p,i,score:sc});
    if(!p.isHuman)say(i,'У меня... ладно, увидите. (я нервничаю)');
    setMood(i,'sweat',3);
  });
  results.sort((a,b)=>G.flags.lowball?cmpScore(a.score,b.score):cmpScore(b.score,a.score));
  const best=results[0].score;
  const winners=results.filter(r2=>cmpScore(r2.score,best)===0);
  const w0=winners[0];
  let cn=CAT_NAMES[w0.score[0]];if(w0.p.cards.some(c=>c.wild))cn+=' 🍌';
  if(G.flags.lowball)cn+=' 🙃 (LOWBALL!)';
  const total=potTotal(),share=Math.floor(total/winners.length);
  winners.forEach(w=>{players[w.i].chips+=share;const s=seat(w.i);
    spawn(s.x,s.y,['🎉','✨','🪙','🍕'],26,300);setMood(w.i,'win',5);});
  G.pot=0;G.currentBet=0;
  G.lastWinner={names:winners.map(w=>players[w.i].name).join(' + '),combo:cn,amount:total,
                you:winners.some(w=>w.i===HUMAN)};
  G.review=results.map(r5=>({name:r5.p.name,char:r5.p.char,
    cards:r5.p.cards.map(c=>({...c})),
    combo:CAT_NAMES[r5.score[0]]+(r5.p.cards.some(c=>c.wild)?' 🍌':''),
    won:winners.some(w=>w.i===r5.i)?share:0,me:r5.i===HUMAN,
    folded:!r5.p.active}));
  if(players[HUMAN].chips>G.bestBank){G.bestBank=players[HUMAN].chips;try{localStorage.setItem('bp_best',G.bestBank);}catch(e){}}
  banner((winners.length>1?'🏆 ДЕЛЁЖКА! ':'🏆 ')+G.lastWinner.names+' · «'+cn+'» +'+total+' 🪙',L.fs(16),3.4);
  snd.fanfare();G.shake=Math.min(12,L.H*0.02);
  winners.forEach(w=>{if(!players[w.i].isHuman)say(w.i,pick(LINES[w.i].win));else react('win',0.8);});
  results.filter(r3=>winners.indexOf(r3)<0).forEach(r3=>{
    if(!r3.p.isHuman&&Math.random()<0.75){say(r3.i,pick(LOSE_LINES));setMood(r3.i,'rage',4);}
  });
  logIt('🎭 ШОУДАУН: '+results.map(r4=>r4.p.name+' — «'+CAT_NAMES[r4.score[0]]+'»').join(', '));
  setTimeout(()=>{if(G.scene==='play'){G.phase='over';}},2600);
}
function finishGame(winnerIdxs,msg){
  G.phase='over';
  const total=potTotal(),share=Math.floor(total/winnerIdxs.length)||0;
  winnerIdxs.forEach(i=>{players[i].chips+=share;const s=seat(i);spawn(s.x,s.y,['🎉','✨','🪙'],22,300);setMood(i,'win',5);});
  G.pot=0;
  G.lastWinner={names:winnerIdxs.map(i=>players[i].name).join(' + '),combo:msg||'Победа без боя',
                amount:total,you:winnerIdxs.indexOf(HUMAN)>=0};
  if(players[HUMAN].chips>G.bestBank){G.bestBank=players[HUMAN].chips;try{localStorage.setItem('bp_best',G.bestBank);}catch(e){}}
  banner(msg||'',L.fs(17));snd.fanfare();tease(winnerIdxs.indexOf(HUMAN)>=0?'win':'lose',0.6);
}
function checkBankrupt(){
  players.forEach((p,i)=>{
    if(p.chips<0){
      if(p.isHuman){p.chips+=100;G.debt+=100;snd.coin();tease('bankrupt',0.7);
        banner('💳 БАНКРОТСТВО ОТМЕНЕНО! +100 🪙 (долг: '+G.debt+')',L.fs(15));
        logIt('💳 Ты обанкротился. Казино выдало 100 🪙. Это не кредит. Это кредит.');
        toast('🏅 ДОСТИЖЕНИЕ: «Банкрот-легенда».');}
      else{p.chips+=60;logIt('🏦 <b>'+p.name+'</b> сделал ребай на 60 🪙. Снова. В кредит. Опять.');}
    }
  });
}

/* ================= РИСОВАНИЕ: ХЕЛПЕРЫ ================= */

   ============================================================ */

/* --- дрожание «кипящей» линии: стабильно в пределах кадра --- */

function nt(txt,x,y,size,color,opt){

  const sq=cond?COND:1;
  /* save/restore стоит дорого (он сбрасывает letterSpacing, и его приходится
     ставить заново). Трансформация нужна только для «плакатного» кегля и
     поворотов — остальной текст рисуем без стека. */
  const tf=sq!==1||opt.rot;
  if(tf)ctx.save();
  setFont(fontStr(size,mono?'mono':(opt.disp===false?'txt':'disp'),opt.weight));
  const tr=opt.track!==undefined?opt.track:trk(size,mono);

  if(tf){ctx.translate(x,y);if(opt.rot)ctx.rotate(opt.rot);if(sq!==1)ctx.scale(sq,1);}
  ctx.textAlign=opt.align||'center';ctx.textBaseline=opt.base||'middle';

let pressed=null;

function uib(x,y,w,h,label,fill,onClick,opt){
  opt=opt||{};

  const en=opt.disabled!==true;
  if(en)HIT.push({x,y,w,h,onClick,key:opt.key});

  const seed=x*0.17+y*0.09+(opt.key?opt.key.length:0);

  if(!en)hatch(0,0,w,h,0.7,6,'#000',0.35);

  if(opt.pulse&&en){
    const p=0.5+0.5*Math.sin(G.t*4.2);
    ctx.globalAlpha=0.25+0.4*p;
    cutPath(-3,-3,w+6,h+6,cut+2,seed+7,false);

      en?(opt.subColor||(dark?'rgba(10,6,14,.7)':'rgba(240,235,225,.66)')):'rgba(240,235,225,.4)',

}

  nt(label,x+w/2+h*0.16,y+h/2,L.fs(11),TH.ink,{mono:true,maxW:w-h*0.8,weight:700});
  ctx.restore();
}

/* ================= КАРТЫ (СПРАЙТ, ЦЕНТР-ЯКОРЬ) ================= */
function drawCardSprite(cx,cy,w,h,c,faceUp,rot,opts){
  opts=opts||{};
  const x=-w/2,y=-h/2,rad=Math.max(3,w*0.12);
  ctx.save();
  ctx.translate(cx,cy);
  if(rot)ctx.rotate(rot);
  roughRect(x,y,w,h,rad,cx*0.31+cy*0.17);
  if(!faceUp){
    const g=ctx.createLinearGradient(x,y,x+w,y+h);
    g.addColorStop(0,'#5a6798');g.addColorStop(1,'#262e4c');
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(214,232,255,.7)';ctx.lineWidth=1.4;ctx.stroke();
    ctx.save();
    roughRect(x,y,w,h,rad,cx*0.31+cy*0.17);ctx.clip();
    ctx.lineWidth=1;
    const step=Math.max(5,w*0.24);
    ctx.strokeStyle='rgba(170,205,255,.34)';ctx.beginPath();
    for(let i=-h;i<w+h;i+=step){ctx.moveTo(x+i,y);ctx.lineTo(x+i+h,y+h);}
    ctx.stroke();
    ctx.strokeStyle='rgba(255,110,165,.26)';ctx.beginPath();
    for(let i=-h;i<w+h;i+=step){ctx.moveTo(x+i,y+h);ctx.lineTo(x+i+h,y);}
    ctx.stroke();
    const cr=w*0.2;
    ctx.fillStyle='rgba(220,235,255,.3)';ctx.beginPath();
    ctx.arc(x+w/2-cr*0.5,y+h/2,cr*0.42,0,TAU);
    ctx.arc(x+w/2,y+h/2-cr*0.15,cr*0.5,0,TAU);
    ctx.arc(x+w/2+cr*0.5,y+h/2,cr*0.42,0,TAU);
    ctx.fill();
    ctx.restore();
    ctx.restore();
    return;
  }
  ctx.fillStyle='#f7f7f4';ctx.fill();
  if(opts.glow){ctx.shadowColor=opts.glow;ctx.shadowBlur=16;}
  ctx.strokeStyle=opts.edge||'rgba(10,12,20,.35)';ctx.lineWidth=1;ctx.stroke();
  ctx.shadowBlur=0;
  ctx.save();
  roughRect(x,y,w,h,rad,cx*0.31+cy*0.17);ctx.clip();   // мягкий внутренний свет сверху
  const sh=ctx.createLinearGradient(0,y,0,y+h*0.4);
  sh.addColorStop(0,'rgba(255,255,255,.9)');sh.addColorStop(1,'rgba(180,185,200,.16)');
  ctx.fillStyle=sh;ctx.fillRect(x,y,w,h*0.4);
  ctx.restore();
  if(c&&c.wild){
    roughRect(x+w*0.08,y+h*0.06,w*0.84,h*0.88,rad*0.7,cx+cy);
    const bg2=ctx.createLinearGradient(x,y,x+w,y+h);
    bg2.addColorStop(0,'#fff3c0');bg2.addColorStop(1,'#ffd977');
    ctx.fillStyle=bg2;ctx.fill();
    ctx.font=Math.round(w*0.6)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🍌',0,-h*0.04);
    nt('WILD',0,y+h-h*0.14,Math.max(7,Math.round(w*0.17)),'#7a5b00',{glow:false,mono:true});
    ctx.restore();
    return;
  }
  const rank=RANK_TXT[c.rank]||String(c.rank);
  const suit=G.flags.crazySuits?CRAZY_SUITS[c.suit]:SUITS[c.suit];
  const red=!G.flags.crazySuits&&(c.suit===1||c.suit===2);
  const col=red?'#e01040':'#151026';
  const tiny=w<27;
  ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='top';
  ctx.font='900 '+Math.round(w*(tiny?0.44:0.32))+'px '+F_HEAD;
  ctx.fillText(rank,x+w*0.1,y+h*0.05);
  ctx.font='700 '+Math.round(w*(tiny?0.34:0.24))+'px serif';
  ctx.fillText(suit,x+w*0.11,y+h*0.05+w*(tiny?0.44:0.34));
  if(!tiny){
    ctx.save();                                      // зеркальный угол
    ctx.translate(x+w-w*0.1,y+h-h*0.06);ctx.rotate(Math.PI);
    ctx.textAlign='left';ctx.textBaseline='top';
    ctx.font='900 '+Math.round(w*0.24)+'px '+F_HEAD;ctx.fillText(rank,0,0);
    ctx.font='700 '+Math.round(w*0.18)+'px serif';ctx.fillText(suit,w*0.02,w*0.26);
    ctx.restore();
  }
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 '+Math.round(w*(tiny?0.58:0.5))+'px serif';
  if(red){ctx.shadowColor='#ff2e88';ctx.shadowBlur=6;}
  ctx.fillText(suit,0,h*(tiny?0.22:0.06));
  ctx.shadowBlur=0;
  ctx.restore();
}

/* --- позиции карт (единые для раздачи и отрисовки) --- */
function handMul(){return G.flags.big?1.14:1;}
function handCardPos(k,cnt){
  const h=L.hand,m=handMul(),cw=h.cw*m,chh=h.ch*m,gap=h.gap*m;
  const total=cnt*cw+(cnt-1)*gap;
  return {x:h.cx-total/2+cw/2+k*(cw+gap),y:h.y+chh/2,cw:cw,ch:chh};
}
function botCardPos(i,k,cnt){
  const s=seat(i),cw=L.bcw,chh=L.bch;
  if(L.fanBehind){                           // карты у внешнего плеча
    const side=(s.x<L.cx?-1:1);
    return {x:s.x+side*(s.r*0.95+cw*0.45)+side*k*cw*0.34,y:s.y+s.r*0.34-k*chh*0.06,cw:cw,ch:chh};
  }
  const gap=Math.max(2,cw*0.18),total=cnt*cw+(cnt-1)*gap;
  return {x:s.x-total/2+cw/2+k*(cw+gap),y:s.y+s.r*1.62+L.botTextH+chh/2,cw:cw,ch:chh};
}

/* ================= ФОН: БОЛОТО В ЦВЕТУ =================
   Не чёрный: гнилые закатные градиенты, кислотные пятна,
   полосатое солнце с силуэтом петуха, сетка, камыши, глаза.

const BLOBS=[
  {c:TH.rose,ax:0.22,ay:0.3,fx:0.031,fy:0.047,r:0.55},
  {c:TH.cyan, ax:0.78,ay:0.24,fx:0.023,fy:0.037,r:0.48},

const REEDS=Array.from({length:26},(_,i)=>({x:h1(i*3.1),h:0.1+h1(i*7.7)*0.22,w:2+h1(i*5.5)*3,ph:h1(i*2.2)*TAU}));
const EYES=Array.from({length:9},(_,i)=>({x:h1(i*11.3),y:0.12+h1(i*4.7)*0.62,s:0.6+h1(i*9.1)*0.8,ph:h1(i*6.6)*TAU}));
let plateCv=null,plateCtx=null,fxCv=null,fxCtx=null,plateKey='';

  g.addColorStop(0,'#150a26');g.addColorStop(0.42,'#1d0d2c');
  g.addColorStop(0.72,'#2a0f26');g.addColorStop(1,'#0c1a20');

  /* пост-тарелка: виньетка + scrim'ы (рисуется один раз за ресайз) */
  fxCtx.clearRect(0,0,pw,ph);
  const vg=fxCtx.createRadialGradient(pw/2,ph*0.46,Math.min(pw,ph)*0.3,pw/2,ph*0.5,Math.max(pw,ph)*0.76);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(0.55,'rgba(6,3,12,.3)');
  vg.addColorStop(0.85,'rgba(20,4,20,.6)');vg.addColorStop(1,'rgba(40,4,26,.78)');
  fxCtx.fillStyle=vg;fxCtx.fillRect(0,0,pw,ph);
  const hudH=(L?L.hudTop:60)+15,abH=(L?L.ab:100)+17;

  sc.addColorStop(0,'rgba(6,4,12,.72)');sc.addColorStop(1,'rgba(6,4,12,0)');
  fxCtx.fillStyle=sc;fxCtx.fillRect(0,0,pw,hudH/2);
  const sc2=fxCtx.createLinearGradient(0,ph-abH,0,ph);
  sc2.addColorStop(0,'rgba(6,4,12,0)');sc2.addColorStop(1,'rgba(6,4,12,.66)');
  fxCtx.fillStyle=sc2;fxCtx.fillRect(0,ph-abH,pw,abH);

function drawBg(){
  buildPlates();
  ctx.drawImage(plateCv,0,0,plateCv.width,plateCv.height,0,0,W,H);
  /* кислотные пятна: считаем на 1/6 разрешения и растягиваем */
  {
    const sw=Math.max(8,Math.round(W/6)),sh2=Math.max(8,Math.round(H/6));
    if(!blobCtx||blobCv.width!==sw||blobCv.height!==sh2){
      blobCv=document.createElement('canvas');blobCv.width=sw;blobCv.height=sh2;
      blobCtx=blobCv.getContext('2d');
    }
    blobCtx.clearRect(0,0,sw,sh2);
    BLOBS.forEach((b,i)=>{
      const x=sw*(0.5+Math.sin(G.t*b.fx*TAU*0.16+i)*b.ax*0.9);
      const y=sh2*(0.5+Math.cos(G.t*b.fy*TAU*0.14+i*1.7)*b.ay*0.9);
      const r=Math.max(sw,sh2)*b.r*(0.75+0.25*Math.sin(G.t*0.4+i));
      const rg=blobCtx.createRadialGradient(x,y,r*0.05,x,y,r);
      rg.addColorStop(0,hexA(b.c,0.42));rg.addColorStop(0.55,hexA(b.c,0.13));rg.addColorStop(1,hexA(b.c,0));
      blobCtx.fillStyle=rg;blobCtx.fillRect(0,0,sw,sh2);
    });
    ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=0.5;
    ctx.drawImage(blobCv,0,0,sw,sh2,0,0,W,H);ctx.restore();
  }
  /* полосатое солнце с силуэтом петуха */
  {
    const sx=W*0.5,sy=L.table.top+Math.round(6*L.S),sr=Math.min(W*0.16,L.table.ry*1.5);
    if(sr>18){
      ctx.save();
      ctx.beginPath();
      ctx.rect(sx-sr*1.2,Math.max(0,sy-sr*1.3),sr*2.4,sr*2.6);ctx.clip();
      const sg=ctx.createLinearGradient(0,sy-sr,0,sy+sr);
      sg.addColorStop(0,hexA(TH.gold,0.5));sg.addColorStop(0.55,hexA(TH.rose,0.34));
      sg.addColorStop(1,hexA(TH.violet,0.12));
      ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,sr,0,TAU);ctx.fill();
      ctx.globalCompositeOperation='destination-out';
      for(let i=0;i<8;i++){const yy=sy-sr*0.1+i*(sr*0.16);
        ctx.fillRect(sx-sr,yy,sr*2,Math.max(1.2,sr*0.035+i*0.5));}
      ctx.restore();
      /* на горизонте — только солнце: силуэт петуха читался как лужа */
    }
  }
  /* звёзды/пыль */
  const cols=Math.max(6,Math.round(W/26));
  for(let i=0;i<cols*2;i++){
    const sx=(i*197)%W,sy=(i*89)%((L.hudTop+L.table.top*0.8)|0||140);
    const a=0.1+0.42*Math.abs(Math.sin(G.t*1.7+i));
    ctx.fillStyle=i%7===0?hexA(TH.cyan,a):hexA('#e8eef8',a*0.8);
    ctx.fillRect(sx,sy,1.6,1.6);
  }
  /* перспективная сетка */
  ctx.save();
  const hz=L.table.cy+L.table.ry*0.95,off=(G.t*34)%40;
  ctx.lineWidth=1;
  for(let i=0;i<10;i++){
    const y=hz+i*i*2.9+off*0.35;if(y>H)break;
    ctx.strokeStyle=hexA(TH.rose,0.16-i*0.012);
    P();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  }
  for(let i=-9;i<=9;i++){
    ctx.strokeStyle=hexA(i%3===0?TH.cyan:TH.violet,0.09);
    P();ctx.moveTo(W/2+i*28,hz);ctx.lineTo(W/2+i*(W*0.36),H);ctx.stroke();
  }
  ctx.strokeStyle=hexA(TH.acid,0.16);
  P();ctx.moveTo(0,hz);ctx.lineTo(W,hz);ctx.stroke();
  ctx.restore();
  /* глаза в темноте */
  EYES.forEach((e,i)=>{
    const x=e.x*W,y=e.y*H,blink=Math.sin(G.t*0.9+e.ph)>0.92?0.12:1;
    const k=(mouse.x-x)*0.008,m=(mouse.y-y)*0.008;
    ctx.save();ctx.globalAlpha=0.16+0.12*Math.abs(Math.sin(G.t*0.7+e.ph));
    ctx.fillStyle='#f2e7cf';
    ctx.beginPath();ctx.ellipse(x,y,6*e.s,4.4*e.s*blink,0,0,TAU);ctx.fill();
    ctx.fillStyle='#12080f';
    ctx.beginPath();ctx.arc(x+clamp(k,-2.4,2.4)*e.s,y+clamp(m,-1.8,1.8)*e.s*blink,2.2*e.s*blink,0,TAU);ctx.fill();
    ctx.restore();
  });
  /* камыши снизу */
  ctx.save();
  REEDS.forEach((rd,i)=>{
    const x=rd.x*W,base=H, hgt=rd.h*H*0.5;
    const sway=Math.sin(G.t*0.9+rd.ph)*Math.round(9*L.S);
    ctx.strokeStyle='rgba(6,10,12,.72)';ctx.lineWidth=rd.w;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x,base);
    ctx.quadraticCurveTo(x+sway*0.5,base-hgt*0.6,x+sway,base-hgt);ctx.stroke();
    ctx.fillStyle='rgba(8,12,14,.8)';
    ctx.beginPath();ctx.ellipse(x+sway,base-hgt-rd.w*1.6,rd.w*0.9,rd.w*2.4,sway*0.02,0,TAU);ctx.fill();
  });
  ctx.restore();
  /* плавающие символы */
  floaters.forEach(f=>{
    f.ny-=f.v*0.016/H;if(f.ny<-0.04){f.ny=1.04;f.nx=Math.random();}
    ctx.save();ctx.globalAlpha=0.09;ctx.translate(f.nx*W,f.ny*H);ctx.rotate(f.rot*0.3+G.t*f.s*0.3);
    ctx.font=Math.round((16+f.s*16)*L.S)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.e,0,0);ctx.restore();
  });
  /* VHS-полосы помех */
  ctx.save();ctx.globalCompositeOperation='screen';
  for(let i=0;i<3;i++){
    const y=((G.t*(28+i*17)+i*331)%(H+160))-80;
    const bg=ctx.createLinearGradient(0,y,0,y+Math.round(26*L.S));
    bg.addColorStop(0,'rgba(255,255,255,0)');bg.addColorStop(0.5,'rgba(190,220,255,.05)');
    bg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=bg;ctx.fillRect(0,y,W,Math.round(26*L.S));
  }
  ctx.restore();
}

/* ================= ПОСТ-ЭФФЕКТЫ (усиленные) =================
   bloom в два прохода, CRT-маска, сканлайны, зерно, разлом
   кадра, бегущая полоса, виньетка с цветным краем, scrim'ы.
   ==================================================================== */
let bloomCv=null,bloomCtx=null,blobCv=null,blobCtx=null,fxTick=0,ovPlates=null;
/* --- плашка-тарелка поверх сцены: только горизонтальные ПОЛОСКИ + слабая виньетка.
   Никакой RGB-маски и плотного зерна: раньше они давали эффект «полотна»,
   через которое ничего не видно. now ~x0.35 от прежней плотности --- */
function stripeStep(){return Math.max(2,Math.round(2.6*(L?L.S:1)));}   // шаг полосок (в полуразмере)
function buildOverlay(){
  const pw=Math.max(8,Math.round(W/2)),ph=Math.max(8,Math.round(H/2));   // полуразрешение: дешевле
  ovPlates=ovPlates&&ovPlates[0]&&ovPlates[0].width===pw?ovPlates:[];
  if(ovPlates.length===3)return;
  ovPlates=[];
  const step=stripeStep();
  for(let f=0;f<3;f++){
    const c=document.createElement('canvas');c.width=pw;c.height=ph;
    const g=c.getContext('2d');
    /* виньетка + scrim'ы (негатив: затемняем края) */
    const vg=g.createRadialGradient(pw/2,ph*0.46,Math.min(pw,ph)*0.34,pw/2,ph*0.5,Math.max(pw,ph)*0.82);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(0.6,'rgba(6,3,12,.1)');
    vg.addColorStop(0.88,'rgba(20,4,20,.18)');vg.addColorStop(1,'rgba(40,4,26,.3)');
    g.fillStyle=vg;g.fillRect(0,0,pw,ph);
    const hudH=(L?L.hudTop:60)/2,abH=(L?L.ab:100)/2+9;
    const sc=g.createLinearGradient(0,0,0,hudH);
    sc.addColorStop(0,'rgba(6,4,12,.4)');sc.addColorStop(1,'rgba(6,4,12,0)');
    g.fillStyle=sc;g.fillRect(0,0,pw,hudH);
    const sc2=g.createLinearGradient(0,ph-abH,0,ph);
    sc2.addColorStop(0,'rgba(6,4,12,0)');sc2.addColorStop(1,'rgba(6,4,12,.36)');
    g.fillStyle=sc2;g.fillRect(0,ph-abH,pw,abH);
    /* горизонтальные полоски: тонкая тень + светлый парный гребень */
    for(let y=0;y<ph;y+=step){
      g.fillStyle='rgba(0,0,0,.085)';g.fillRect(0,y,pw,1);
      g.fillStyle='rgba(255,255,255,.022)';g.fillRect(0,y+1,pw,1);
    }
    /* едва заметное зерно, вписанное прямо в тарелку */
    const id=g.getImageData(0,0,pw,ph),d=id.data;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<=0)continue;
      const n=(Math.random()-0.5)*8;
      d[i]=Math.max(0,Math.min(255,d[i]+n));
      d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
      d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
    }
    g.putImageData(id,0,0);
    ovPlates.push(c);
  }
}
function mkTile(w,h,fn){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  fn(c.getContext('2d'),w,h);return c;
}
function initTex(){/* зерно и маска пекутся в buildOverlay() */}
function blurCopy(target,blur,sat,bri){
  target.setTransform(1,0,0,1,0,0);
  target.clearRect(0,0,target.canvas.width,target.canvas.height);
  try{target.filter='blur('+blur+'px) brightness('+bri+') saturate('+sat+')';}catch(e){}
  target.drawImage(sceneCv,0,0,sceneCv.width,sceneCv.height,0,0,target.canvas.width,target.canvas.height);
  target.filter='none';
}
function bloomPass(){
  try{
    const bw=Math.max(2,Math.round(W/6)),bh=Math.max(2,Math.round(H/6));
    if(!bloomCv||bloomCv.width!==bw||bloomCv.height!==bh){
      bloomCv=document.createElement('canvas');bloomCv.width=bw;bloomCv.height=bh;

function seatFan(i){
  const p=players[i],cnt=p.cards.length,now=G.t,s=seat(i);
  if(!cnt||p.isHuman)return;
  for(let k=0;k<cnt;k++){
    const pos=botCardPos(i,k,cnt);
    const reveal=(G.revealAll&&p.active)||p.revealUntil>now;
    drawCardSprite(pos.x,pos.y,pos.cw,pos.ch,p.cards[k],reveal,(k-(cnt-1)/2)*0.06,{glow:reveal?TH.mint:null});
  }
  if(G.revealAll&&p.active&&cnt>=3)
    nt(comboName(p.cards),s.x,botCardPos(i,0,cnt).y+L.bch/2+L.fs(11),L.fs(8.6),TH.gold,{glow:false,maxW:W*0.42,mono:true});
}
function drawSeatStack(i){
  const p=players[i],s=seat(i),now=G.t,fs=L.fs;
  const isTurn=G.phase==='bet'&&G.actor===i&&p.active;
  const state=!p.active&&G.phase!=='idle'?'out':p.allin?'allin':isTurn?'turn':'idle';
  const accent=p.isHuman?TH.cyan:(i===1?TH.mint:i===2?TH.gold:TH.rose);
  ctx.save();
  ctx.globalAlpha=(p.active||G.phase==='over')?1:0.32;
  if(L.fanBehind)seatFan(i);
  avatarStage(s.x,s.y+s.r*0.1,s.r,accent,state,now);
  ctx.save();
  if(state==='out')ctx.filter='grayscale(.9) brightness(.6)';
  drawCharacter(p.char,s.x,s.y,s.r,now,moodOf(p),i*1.7);
  ctx.restore();
  if(state==='out')nt('СКИНУЛ',s.x,s.y-s.r*1.15,fs(8),TH.ink3,{mono:true,glow:false,upper:true,track:1});
  // подпись: имя (mono), баланс (крупно), статус
  const nameY=s.y+s.r*1.62+fs(9);
  const nameW=L.portrait?Math.min(W*0.26,s.r*4.6):Math.min(W*0.3,s.r*5.4);
  const tx=clamp(s.x,nameW/2+L.sl+3,W-nameW/2-L.sr-3);
  nt(p.name,tx,nameY,fs(8.2),TH.ink2,{mono:true,glow:false,maxW:nameW,upper:true,track:0.6,weight:700});
  nt(p.chips+' 🪙',tx,nameY+fs(15),fs(12),state==='out'?TH.ink3:TH.ink,{glow:false,weight:800});
  let badge='',bcol=TH.gold;
  if(p.allin){badge='ОЛЛ-ИН';bcol=TH.rose;}
  else if(isTurn){badge='ХОДИТ';bcol=accent;}
  if(badge){
    const bw=txtW(badge,fs(8),true)+Math.round(14*L.S),bh=Math.round(15*L.S);
    rr(tx-bw/2,nameY+fs(31)-bh/2,bw,bh,bh/2);
    ctx.fillStyle=hexA(bcol,0.16);ctx.fill();
    ctx.lineWidth=1;ctx.strokeStyle=hexA(bcol,0.55);ctx.stroke();
    nt(badge,tx,nameY+fs(31),fs(8),bcol,{mono:true,glow:false,upper:true,track:1});
  }
  if(!L.fanBehind)seatFan(i);
  // ставка
  if(p.bet>0){
    const bx=p.isHuman?s.x+s.r*0.2:(L.compact?s.x-s.r*1.5:s.x+s.r*1.25);
    const by=p.isHuman?s.y-s.r*1.5:s.y+s.r*0.5;
    const rr2=Math.max(9,s.r*0.34);
    ctx.save();P();ctx.arc(bx,by,rr2,0,TAU);ctx.fillStyle=TH.gold;ctx.fill();
    ctx.lineWidth=2;ctx.strokeStyle='rgba(0,0,0,.35)';ctx.stroke();ctx.restore();
    nt(String(p.bet),bx,by,fs(9),'#141018',{glow:false,mono:true,weight:700});
  }
  ctx.restore();
  // баббл
  if(p.bubble&&p.bubble.until>now){
    const life=p.bubble.until-now,al=clamp(life>0.5?1:life*2,0,1);
    const maxW=Math.min(Math.max(120,W*0.46),L.portrait?240:220);
    const size=G.flags.whisper?fs(9):fs(10.5);
    const bh=measureWrap(p.bubble.text,maxW-20,size)*(size+4)+Math.round(26*L.S);
    let by=s.y-s.r*1.5-bh-Math.round(10*L.S);
    const under=s.y+s.r*1.62+L.botTextH+(L.fanBehind?0:L.bch+Math.round(10*L.S));
    if(by<L.hudTop+4)by=under;
    if(by+bh>L.handY-4)by=Math.max(L.hudTop+4,s.y-s.r*1.5-bh-Math.round(10*L.S));
    ctx.save();ctx.globalAlpha=al;
    drawBubble(clamp(s.x-maxW/2,L.sl+4,W-L.sr-maxW-4),by,p.bubble.text,maxW,accent,p.name);
    ctx.restore();
  }
}

    tx+=tw+Math.round(12*L.S);

  if(!L.portrait){

    const cells=[
      {l:'РАУНД',v:(G.round||1)+'/'+G.maxRounds,c:TH.cyan,pri:2},
      {l:'БАНК',v:String(potTotal()),c:TH.gold,pri:1},
      {l:'⏱',v:Math.ceil(Math.max(0,G.timeLeft))+'с',c:G.timeLeft<10?TH.red:TH.mint,pri:0},
      {l:'БАЛАНС',v:String(p.chips),c:TH.ink,pri:1},
      {l:'🍕',v:String(G.pizzas),c:TH.rose,pri:2},
      {l:'🧠',v:String(G.hints),c:TH.violet,pri:3}

    if(G.debt>0)cells.push({l:'ДОЛГ',v:String(G.debt),c:TH.red,pri:4});
    cells.sort((a,b)=>a.pri-b.pri);
    let px=rightLimit;
    for(let i=cells.length-1;i>=0;i--){
      const c=cells[i],w=statCell(0,0,0,c.l,c.v,c.h||c.c,true);
      px-=w+Math.round(14*L.S);

}

function bodyGrid(px,py,pw,ph,pad){
  const inner=pw-pad*2,cols=inner>Math.round(540*L.S)?2:1;
  const cgap=cols>1?Math.round(26*L.S):0;
  const area={x:px+pad,y:py+Math.round(54*L.S),w:inner,h:ph-Math.round(54*L.S)-Math.round(66*L.S)};
  return {area:area,cols:cols,colW:(inner-cgap*(cols-1))/cols,cgap:cgap};

function scrollBody(items,area,cols){
  const cgap=cols>1?Math.round(26*L.S):0,cw=(area.w-cgap*(cols-1))/cols;
  const hs=items.map(it=>it.s*(it.gap||1.42));
  const tot=hs.reduce((a,b)=>a+b,0);
  const n=Math.max(1,Math.min(cols||1,Math.ceil(tot/Math.max(40,area.h))));
  /* склеиваем строки в блоки по it.grp — правило/запись не разрезается между колонками */
  const blocks=[];
  items.forEach((it,i)=>{
    const cur=blocks[blocks.length-1];
    if(!cur||it.grp===undefined||cur.grp!==it.grp)blocks.push({grp:it.grp,is:[i],h:hs[i]});
    else{cur.is.push(i);cur.h+=hs[i];}
  });
  const grp=Array.from({length:n},()=>({is:[],h:0}));
  /* режим «газеты»: колонки идут подряд, а не в шахматном порядке */
  let rest=tot,ptr=0;
  for(let c=0;c<n;c++){
    const target=rest/(n-c);
    let h=0,k=ptr;
    while(k<blocks.length&&h<target){h+=blocks[k].h;k++;}
    if(c===n-1){for(let m=ptr;m<blocks.length;m++)h+=blocks[m].h;k=blocks.length;}
    for(let m=ptr;m<k;m++)blocks[m].is.forEach(i=>grp[c].is.push(i));
    grp[c].h=h;rest-=h;ptr=k;
  }
  const maxH=Math.max.apply(null,grp.map(g=>g.h));
  clipRect(area);
  grp.forEach((g,ci)=>{
    const ax=area.x+ci*(cw+cgap);
    let y=area.y+Math.round(8*L.S)-G.scroll;
    g.is.forEach(i=>{
      const it=items[i];
      if(it.badge)nt(it.badge,ax,y+it.s*0.72,it.bs||it.s*0.78,TH.ink3,
        {mono:true,glow:false,align:'left'});
      if(it.t)nt(it.t,it.align==='r'?ax+cw-it.pad:ax+it.pad,y+it.s*0.72,it.s,it.c,
        {align:it.align==='r'?'right':'left',glow:false,weight:it.w||700,mono:it.mono});
      y+=hs[i];
    });
  });
  ctx.restore();
  applyScroll(area,maxH);
}

function drawReviewPanel(){
  const fs=L.fs,pad=Math.round(20*L.S),rgap=Math.round(9*L.S);

  const narrow=pw<Math.round(470*L.S);
  /* карты — главный размер ряда: на узком экране уходят второй строкой */
  const gp=Math.round(3.5*L.S);
  let cw=Math.round(clamp(36*L.S,26,54));
  const area0w=pw-pad*2;
  if(narrow)cw=Math.round(clamp((area0w-Math.round(28*L.S)-4*gp)/5,18,44*L.S));
  else cw=Math.max(20,Math.min(cw,Math.round((area0w-Math.round(170*L.S)-4*gp)/5)));
  const ch=Math.round(cw*1.42),
        rowH=narrow?Math.round(ch+Math.round(96*L.S)):Math.max(ch+Math.round(26*L.S),Math.round(74*L.S));
  const rows=G.review||[];
  let ph=Math.min(H-Math.round(40*L.S),L.panelH);
  ph=Math.min(H-Math.round(40*L.S),Math.max(Math.round(240*L.S),
      rows.length*(rowH+rgap)+Math.round(54*L.S)+Math.round(72*L.S)));
  const px=(W-pw)/2,py=(H-ph)/2;
  panel(px,py,pw,ph,TH.violet,'РАЗБОР СДАЧИ',G.lastWinner?G.lastWinner.combo.slice(0,18):'');
  const area={x:px+pad,y:py+Math.round(54*L.S),w:area0w,h:ph-Math.round(54*L.S)-Math.round(72*L.S)};
  clipRect(area);
  rows.forEach((r,i)=>{
    const y=area.y+i*(rowH+rgap)-G.scroll;
    const n=r.cards.length||1,stripW=n*cw+(n-1)*gp;
    cutPath(area.x,y,area.w,rowH,Math.round(14*L.S),i*2.7);

    const rr2=Math.round(narrow?20*L.S:rowH*0.3),
          ax0=area.x+Math.round(14*L.S)+rr2,
          cy0=narrow?y+Math.round(26*L.S)+rr2:y+rowH/2;

    drawCharacter(r.char,ax0,cy0-rr2*0.1,rr2,G.t,r.folded?'sulk':(r.won?'win':'idle'),i*1.7);
    const tx=ax0+rr2+Math.round(12*L.S),
          sx=narrow?area.x+Math.round(14*L.S):area.x+area.w-Math.round(13*L.S)-stripW,
          sy=narrow?y+rowH-Math.round(ch/2)-Math.round(9*L.S):y+rowH*0.58,
          maxW=narrow?area.w-Math.round(150*L.S)
                    :area.x+area.w-stripW-Math.round(26*L.S)-tx;
    nt(r.name,tx,cy0-Math.round(11*L.S),fs(8.6),TH.ink2,{mono:true,align:'left',upper:true,maxW:maxW});
    nt(r.folded?'СКИНУЛ':r.combo,tx,cy0+Math.round(9*L.S),fs(12.5),r.won?TH.mint:TH.ink,
      {align:'left',maxW:maxW,weight:800});
    r.cards.forEach((c,k)=>drawCardSprite(sx+cw/2+k*(cw+gp),sy,cw,ch,c,true,0,{glow:null}));
    if(r.won)nt('+'+r.won,area.x+area.w-Math.round(13*L.S),y+Math.round(14*L.S),fs(11),TH.gold,
      {align:'right',mono:true});
  });
  ctx.restore();
  applyScroll(area,rows.length*(rowH+rgap)+Math.round(8*L.S));
  closeBtn(W/2-Math.round(96*L.S),py+ph-Math.round(52*L.S),Math.round(192*L.S),'ЗАКРЫТЬ',closeOverlay);

function drawCheatsSheet(){
  const fs=L.fs,pad=Math.round(20*L.S);
  G.sheetT=Math.min(1,(G.sheetT||0)+0.14);
  const k=1-Math.pow(1-G.sheetT,3);
  const gw=Math.min(W-pad*2,Math.round(880*L.S)),gx=Math.round((W-gw)/2);
  const cgap=Math.round(9*L.S);
  const cols=clamp(Math.round(gw/Math.round(240*L.S)),2,4);
  const cellW=Math.floor((gw-cgap*(cols-1))/cols);
  const cellH=Math.max(62,Math.round(72*L.S));
  const rowsN=Math.ceil(CHEATS.length/cols);
  const headH=Math.round(54*L.S),footH=Math.max(54,Math.round(60*L.S));
  const needH=rowsN*cellH+(rowsN-1)*cgap;
  const gridH=Math.min(needH,Math.max(cellH,H-Math.round(52*L.S)-headH-footH));
  const sh=headH+gridH+footH,y=H-sh*k;
  OVRECT={x:0,y:y,w:W,h:sh};
  ctx.save();
  elev(0.7);
  cutPath(-4,y,W+8,H-y+8,Math.round(26*L.S),y*0.11);ctx.fillStyle=TH.surf2;ctx.fill();noElev();
  ctx.lineWidth=2;ctx.strokeStyle='rgba(5,3,9,.9)';ctx.stroke();
  misprint(hexA(TH.acid,0.4),2);
  ctx.restore();
  rr(W/2-Math.round(17*L.S),y+Math.round(7*L.S),Math.round(34*L.S),Math.round(4*L.S),2);
  ctx.fillStyle='rgba(255,255,255,.24)';ctx.fill();
  nt('ЧИТЫ',gx,y+Math.round(32*L.S),fs(16),TH.ink,{glow:false,weight:800,align:'left'});
  nt('🍕 '+G.pizzas+' · ОСЁЛ СЧИТАЕТ',gx+gw,y+Math.round(32*L.S),fs(8.6),G.pizzas?TH.gold:TH.ink3,
    {mono:true,glow:false,align:'right',upper:true});
  const area={x:gx,y:y+headH,w:gw,h:gridH};
  clipRect(area);
  CHEATS.forEach((c,i)=>{
    const col=i%cols,row=Math.floor(i/cols);
    const x=gx+col*(cellW+cgap),yy=area.y+row*(cellH+cgap)-G.scroll;
    const can=G.pizzas>=c.cost;
    ctx.save();ctx.globalAlpha=can?1:0.4;
    cutPath(x,yy,cellW,cellH,Math.round(15*L.S),i*3.7);
    ctx.fillStyle=can?'rgba(255,255,255,.07)':'rgba(255,255,255,.02)';ctx.fill();
    ctx.lineWidth=1.8;ctx.strokeStyle='rgba(5,3,9,.85)';ctx.stroke();
    if(can)misprint(hexA(TH.gold,0.5),1.6);
    const cw2=Math.round(46*L.S);
    cutPath(x+cellW-cw2-Math.round(8*L.S),yy+Math.round(9*L.S),cw2,Math.round(19*L.S),Math.round(8*L.S),i*1.7,false);
    ctx.fillStyle=hexA(can?TH.gold:TH.ink3,0.22);ctx.fill();
    ctx.lineWidth=1.2;ctx.strokeStyle='rgba(5,3,9,.7)';ctx.stroke();
    nt(c.cost+' 🍕',x+cellW-cw2/2-Math.round(8*L.S),yy+Math.round(19*L.S),fs(8.6),can?TH.gold:TH.ink3,{glow:false,mono:true});
    nt(c.name,x+Math.round(12*L.S),yy+Math.round(24*L.S),fs(11.5),can?TH.ink:TH.ink3,
      {glow:false,align:'left',weight:800,maxW:cellW-cw2-Math.round(26*L.S)});
    wrapTxt(c.desc,cellW-Math.round(24*L.S),fs(9)).slice(0,2).forEach((l,li)=>
      nt(l,x+Math.round(12*L.S),yy+Math.round(45*L.S)+li*Math.round(13*L.S),fs(9),TH.ink2,
        {glow:false,align:'left',weight:700,maxW:cellW-Math.round(24*L.S)}));
    ctx.restore();
    if(can)HIT.push({x:x,y:yy,w:cellW,h:cellH,onClick:()=>{useCheat(i);if(G.pizzas<CHEATS[i].cost)G.sheetT=0.999;}});
  });
  ctx.restore();
  applyScroll(area,needH);
  const bw=Math.min(gw,Math.round(210*L.S));
  uib(W/2-bw/2,y+headH+gridH+Math.round(10*L.S),bw,Math.max(44,Math.round(46*L.S)),'ЗАКРЫТЬ',null,
      closeOverlay,{size:fs(12),ghost:true});
}

function applyFilters(){
  if(CLEANFX){if(cv.style.filter!=='none')cv.style.filter='none';return;}
  let filt=[];
  if(G.deepfry>0)filt.push('saturate(2.8) contrast(1.35) hue-rotate('+((G.t*70)%360).toFixed(0)+'deg)');
  if(G.flags.invert&&G.scene==='play')filt.push('invert(1) hue-rotate(180deg)');
  if(G.flags.whisper&&G.scene==='play')filt.push('brightness(0.74)');
  const f=filt.join(' ')||'none';
  if(cv.style.filter!==f)cv.style.filter=f;
}

/* ================= ОБНОВЛЕНИЕ ================= */
function update(dt){
  G.t+=dt;
  const ts=G.slowmo>0?0.35:1,sdt=dt*ts;
  if(G.slowmo>0)G.slowmo-=dt;
  if(G.deepfry>0)G.deepfry-=dt;
  if(G.glitch>0)G.glitch-=dt;
  if(G.cheatBadge>0)G.cheatBadge-=dt;
  if(G.flash>0)G.flash-=dt*2;
  if(G.weatherT>0)G.weatherT-=dt;
  if(G.inspect>=0&&G.t-G.inspectT>2.6)G.inspect=-1;
  if(pressed&&pressed.until<G.t)pressed=null;
  G.shake=Math.max(0,G.shake-dt*22);
  G.parts=G.parts.filter(pt=>{pt.life-=dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=(pt.grav||420)*dt;pt.rot+=pt.vr*dt;return pt.life>0;});
  if(G.parts.length>260)G.parts.splice(0,G.parts.length-260);
  G.floats=G.floats.filter(f=>{f.t+=dt;f.y-=38*dt;return f.t<1.6;});
  G.banners=G.banners.filter(b=>{b.t+=dt;return b.t<b.dur;});
  G.toasts=G.toasts.filter(t2=>{t2.t+=dt;return t2.t<3.6;});
  G.flying=G.flying.filter(f=>{
    f.t+=dt;
    if(f.t>=f.dur&&!f.done){f.done=true;snd.pop();return false;}
    return f.t<f.dur;
  });
  G.chartT-=dt;
  if(G.chartT<=0){G.chartT=0.4;
    G.chart.push(clamp(G.chart[G.chart.length-1]+rnd(-14,14),5,95));
    if(G.chart.length>36)G.chart.shift();}
  if(G.scene!=='play')return;
  if(G.phase==='hat'){
    G.hatT+=sdt;G.hatTick-=sdt;
    if(G.hatTick<=0){G.hatTick=0.09;snd.ratchet();}
    if(G.hatT>1.9)applyRuleAndDeal();
  }else if(G.phase==='deal'){
    G.phaseT-=sdt;if(G.phaseT<=0)beginBetting();
  }else if(G.phase==='bet'&&!G.overlay){
    const p=players[G.actor];
    if(p&&p.isHuman&&p.active&&!p.acted){
      G.timeLeft-=sdt;
      if(G.timeLeft<=0)act(HUMAN,'timeout');
      else if(G.timeLeft<6&&G.timeLeft+sdt>=6){tone(660,0.1,'square',0.06);buzz(30);}
    }else if(p&&!p.isHuman){
      G.botDelay-=sdt;if(G.botDelay<=0)botAct(G.actor);
    }
  }
  updateRooster(sdt);updateCat(sdt);updateDonkey(sdt);
  G.catTimer-=sdt*G.madness;if(G.catTimer<=0){G.catTimer=rnd(13,22)/G.madness;if(G.phase!=='over')runCat();}
  G.donkeyTimer-=sdt*G.madness;if(G.donkeyTimer<=0){G.donkeyTimer=rnd(16,26)/G.madness;if(G.phase!=='over')runDonkey();}
  G.nonsenseTimer-=sdt;
  if(G.nonsenseTimer<=0){G.nonsenseTimer=rnd(7,13);
    if(G.phase==='bet'||G.phase==='rooster'){
      const b=pick(players.filter(p=>!p.isHuman));
      if(!b.bubble||b.bubble.until<G.t)say(b.seat,pick(NONSENSE.concat(CHAT_LINES)));}}
  if(Math.random()<0.0007*G.madness&&G.phase==='bet')triggerEvent();
  if(!G.ad){G.adNext-=sdt;if(G.adNext<=0&&G.phase!=='over'){G.adNext=rnd(17,30)/G.madness;spawnAd();}}
  else{G.ad.t+=dt;if(G.ad.t>9)G.ad=null;}
  if(Math.random()<0.004*G.madness){G.glitch=Math.max(G.glitch,0.7);snd.glitch();}
}

function evPos(e){
  const rect=cv.getBoundingClientRect();
  const sx=rect.width?W/rect.width:1,sy=rect.height?H/rect.height:1;
  return{x:(e.clientX-rect.left)*sx,y:(e.clientY-rect.top)*sy};
}
function toggleMute(){
  muted=!muted;try{localStorage.setItem('bp_mute',muted?'1':'0');}catch(e){}
  if(!muted){ac();snd.pop();}
  toast(muted?'🔇 Звук выключен. Петух разочарован.':'🔊 Звук включён.');
}
function cycleQuality(){
  QUALITY=QUALITY>=1?0.45:1;seedFloaters();
  try{localStorage.setItem('bp_fx',QUALITY>=1?'full':'lite');}catch(e){}
  banner(QUALITY>=1?'✨ ЭФФЕКТЫ: ПОЛНЫЕ':'🐌 ЭФФЕКТЫ: ЭКОНОМИЯ',L.fs(16));
  if(QUALITY>=1)snd.disco();else toast('🐌 Меньше частиц и постэффектов — батарея скажет спасибо.');
}
function isFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement);}
function toggleFullscreen(){
  try{
    if(isFullscreen()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
    const el=document.documentElement;
    const req=el.requestFullscreen||el.webkitRequestFullscreen||el.webkitRequestFullScreen;
    if(req){const p=req.call(el,{navigationUI:'hide'});if(p&&p.catch)p.catch(()=>toast('⛶ Браузер не пустил в полный экран.'));}
    else toast('⛶ Здесь полный экран недоступен. В Safari: «Поделиться → На домашний экран».');
  }catch(e){toast('⛶ Полный экран не открылся. Что-то совсем упрямый.');}
}
cv.addEventListener('pointermove',e=>{
  const p=evPos(e);
  if(e.pointerType==='mouse'||CAN_HOVER)mouse=p;
  if(pending&&G.drag){
    const dy=G.drag.startY-p.y;
    if(Math.abs(p.x-G.drag.x)>24||Math.abs(dy)>14){
      G.drag.moved=true;
      if(SCROLL.max>0)G.scroll=clamp(G.drag.scroll+dy,0,SCROLL.max);
    }
  }
});
cv.addEventListener('pointerleave',()=>{mouse={x:-99,y:-99};});
cv.addEventListener('pointerdown',e=>{
  if(e.isPrimary===false)return;
  ac();
  const b=$('boot');if(b&&!b.classList.contains('off'))b.classList.add('off');
  const p=evPos(e);mouse=p;
  G.drag={x:p.x,y:p.y,startY:p.y,scroll:G.scroll,moved:false};
  let found=null;
  for(let i=HIT.length-1;i>=0;i--){const h=HIT[i];if(hitRect(h,p.x,p.y)){found=h;break;}}
  pending=found?{hit:found,x:p.x,y:p.y}:null;
  if(found){pressed={onClick:found.onClick,x:p.x,y:p.y,until:G.t+0.18};}
  else if(G.scene==='play'&&Math.random()<0.3){
    spawn(p.x,p.y,['✨','💢'],3,80,200);
    if(Math.random()<0.15){const bot=pick(players.filter(q=>!q.isHuman));say(bot.seat,'НЕ ТЫКАЙ В СТОЛ. СТОЛ ДОРОГОЙ.');}
  }
});
function endPointer(e){
  const p=evPos(e);
  const moved=G.drag&&G.drag.moved;
  if(pending&&!moved){
    const h=pending.hit;
    if(h&&h.onClick&&hitRect(h,p.x,p.y)){try{snd.pop();h.onClick(p.x,p.y);}catch(err){}}
  }
  pending=null;G.drag=null;
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',()=>{pending=null;G.drag=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{
  if(G.overlay||G.phase==='over'){e.preventDefault();G.scroll=clamp(G.scroll+e.deltaY*0.9,0,SCROLL.max||1e9);snd.ratchet();}
},{passive:false});
window.addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А'){toggleFullscreen();return;}
  if(e.key==='m'||e.key==='M'||e.key==='ь'||e.key==='Ь'){toggleMute();return;}
  if(e.key==='Escape'&&G.overlay){G.overlay=null;return;}
  if(G.scene!=='play'||G.overlay||G.phase==='over')return;
  const k=e.key.toLowerCase();
  if(k==='1')act(HUMAN,'pass');
  else if(k==='2'){if(G.currentBet-players[HUMAN].bet>0)act(HUMAN,'call');}
  else if(k==='3')act(HUMAN,'raise');
  else if(k==='4'){say(HUMAN,'ААААА ВА-БАНК!!!');act(HUMAN,'allin');}
  else if(k==='5')act(HUMAN,'fold');
  else if(k==='h'||k==='р')useHint();
  else if(k==='t'||k==='е')useTurtle();
  else if(k==='c'||k==='с')chaosButton();
});

/* ================= ЦИКЛ ================= */
let lastT=performance.now(),fpsAcc=0,fpsN=0,lowStreak=0,booted=false;
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  if(!document.hidden){update(dt);draw();}
  if(!booted){booted=true;const b=$('boot');if(b&&b.parentNode)b.parentNode.removeChild(b);}
  fpsAcc+=dt;fpsN++;
  if(fpsAcc>1.4){
    const fps=fpsN/fpsAcc;fpsAcc=0;fpsN=0;
    if(AUTOQ&&fps<36){lowStreak++;if(lowStreak>=2&&QUALITY>0.5){QUALITY=0.45;seedFloaters();
      toast('🐢 Низкий FPS — эффекты упрощены. ✨ вверху вернёт полные.');lowStreak=0;}}
    else lowStreak=0;
  }
  requestAnimationFrame(frame);
}
G.roster=rosterFix;
/* Дебаг-хук: отрисовать макет произвольного экрана внутри текущего окна.
   Пример: index.html#play,fit=390x844 */
window.__fitTest=function(w,h,z){
  z=z||1;W=w;H=h;DPR=z;
  cv.width=Math.round(w*z);cv.height=Math.round(h*z);
  sceneCv.width=cv.width;sceneCv.height=cv.height;
  sctx=sceneCv.getContext('2d',{alpha:false});
  ctx=mainCtx;
  cv.style.width=Math.round(w*z)+'px';cv.style.height=Math.round(h*z)+'px';
  const k=Math.min(1,(window.innerWidth-8)/(w*z),(window.innerHeight-8)/(h*z));
  cv.style.transform='scale('+k+')';
  L=buildLayout(w,h);seedFloaters();rosterFix();
};
window.__sim=function(sec){const n=Math.max(1,Math.round(sec*60));for(let i=0;i<n;i++)update(1/60);};
logIt('🐓 Система загружена. Петух в пути. Осёл уже тут. Кот тоже. Ты — последний.');
resize();
$('boot').classList.add('off');
{
  const hs=location.hash||'';
  const fit=hs.match(/fit=(\d+)x(\d+)(?:x(\d+))?/i),sim=hs.match(/sim=(\d+)/i);
  if(fit)setTimeout(()=>{QUALITY=1;AUTOQ=false;window.__fitTest(+fit[1],+fit[2],+(fit[3]||1));},40);
  if(/#?play/.test(hs))setTimeout(()=>{if(G.scene==='title')newGame(false);},80);
  if(sim)setTimeout(()=>{window.__sim(+sim[1]);},170);
  { const ov=hs.match(/ov=(\w+)/i); if(ov)setTimeout(()=>{G.overlay=ov[1];G.sheetT=0;},200); }
  if(/clean/i.test(hs))CLEANFX=true;
}
requestAnimationFrame(frame);
</script>
