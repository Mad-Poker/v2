let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,fEnd,delay){if(muted)return;const a=ac();if(!a)return;
  const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(Math.max(1,f),t0);
  if(fEnd)o.frequency.exponentialRampToValueAtTime(Math.max(1,fEnd),t0+d);
  g.gain.setValueAtTime(vol||0.07,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+d);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+0.06);}
function noise(d,vol,fq,delay){if(muted)return;const a=ac();if(!a)return;
  const t0=a.currentTime+(delay||0),buf=a.createBuffer(1,a.sampleRate*d,a.sampleRate),dat=buf.getChannelData(0);
  for(let i=0;i<dat.length;i++)dat[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=buf;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||900;
  const g=a.createGain();g.gain.setValueAtTime(vol||0.12,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+d);
  s.connect(f);f.connect(g);g.connect(a.destination);s.start(t0);}

/* ================= КАРТЫ / ОЦЕНКА ================= */
function mkDeck(){const d=[];for(let r=2;r<=14;r++)for(let s=0;s<4;s++)d.push({rank:r,suit:s,wild:false});return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newCard(){return{rank:2+Math.floor(Math.random()*13),suit:Math.floor(Math.random()*4),wild:false};}
function scoreReal5(cs){
  const r=cs.map(c=>c.rank).sort((a,b)=>b-a),counts={};
  r.forEach(v=>counts[v]=(counts[v]||0)+1);
  const groups=Object.keys(counts).map(v=>({v:+v,c:counts[v]})).sort((a,b)=>b.c-a.c||b.v-a.v);
  const flush=cs.every(c=>c.suit===cs[0].suit);
  const uniq=[...new Set(r)];let sHigh=0;
  if(uniq.length===5){if(uniq[0]-uniq[4]===4)sHigh=uniq[0];else if(uniq.join(',')==='14,5,4,3,2')sHigh=5;}
  if(flush&&sHigh)return[8,sHigh];
  if(groups[0].c===4)return[7,groups[0].v,groups[1].v];
  if(groups[0].c===3&&groups[1].c===2)return[6,groups[0].v,groups[1].v];
  if(flush)return[5,...r];
  if(sHigh)return[4,sHigh];
  if(groups[0].c===3)return[3,groups[0].v,groups[1].v,groups[2].v];
  if(groups[0].c===2&&groups[1].c===2)return[2,groups[0].v,groups[1].v,groups[2].v];
  if(groups[0].c===2)return[1,groups[0].v,groups[1].v,groups[2].v];
  return[0,...r];
}
function cmpScore(a,b){const n=Math.max(a.length,b.length);for(let i=0;i<n;i++){const d=(a[i]||0)-(b[i]||0);if(d)return d;}return 0;}
function score5(cs){
  const w=cs.filter(c=>c.wild);let real=cs.filter(c=>!c.wild);
  const wn=Math.min(w.length,2);
  for(let i=2;i<w.length;i++)real.push({rank:14,suit:0});
  if(wn===0)return scoreReal5(real);
  const opts=[];for(let r=2;r<=14;r++)for(let s=0;s<4;s++)opts.push({rank:r,suit:s});
  let best=null;
  if(wn===1){for(const o of opts){const sc=scoreReal5(real.concat(o));if(!best||cmpScore(sc,best)>0)best=sc;}}
  else{for(const o1 of opts)for(const o2 of opts){const sc=scoreReal5(real.concat(o1,o2));if(!best||cmpScore(sc,best)>0)best=sc;}}
  return best;
}
function evalHand(cards){const cs=cards.slice();while(cs.length<5)cs.push({rank:2,suit:0,pad:true});return score5(cs);}
function comboName(cards){const sc=evalHand(cards);let n=CAT_NAMES[sc[0]]||'?';if(cards.some(c=>c.wild))n+=' 🍌';return n;}
function handStrength(i){
  const p=players[i];if(!p.cards.length)return 0;
  const sc=evalHand(p.cards);
  const base=[0.12,0.3,0.45,0.55,0.65,0.75,0.85,0.95,1][sc[0]];
  return clamp(base+p.cards.length*0.02+Math.random()*0.12,0,1);
}

function updateRooster(dt){
  const r=G.rooster;
  if(r.mode==='off')return;
  r.flap+=dt;r.rings=r.rings.filter(x=>{x.t+=dt;return x.t<0.9;});
  if(r.mode==='enter'){
    r.t+=dt;const k=Math.min(1,r.t/1.3);
    r.x=lerp(-90,480,k);r.y=lerp(140,205,k)+Math.sin(r.t*9)*34*(1-k);
    if(Math.random()<0.4)spawn(r.x-20,r.y+10,['🪶'],1,60,150);
    if(k>=1){r.mode='act';r.t=0;doRoosterAct();}
  }else if(r.mode==='act'){
    r.t+=dt;r.y=205+Math.sin(r.t*4)*4;
    if(r.action==='crow'&&r.t>0.25&&r.t<0.3)for(let i=0;i<3;i++)ring(r.x+34,r.y-30,'#ff2e88');
    if(r.t>1.9){r.mode='exit';r.t=0;}
  }else if(r.mode==='exit'){
    r.t+=dt;const k=Math.min(1,r.t/1.1);
    if(r.bag){r.x=lerp(480,1060,k);r.y=lerp(205,40,k);}
    else{r.x=lerp(480,1060,k);r.y=205+Math.sin(r.t*9)*30*k;}
    if(Math.random()<0.4)spawn(r.x-20,r.y+10,['🪶'],1,60,150);
    if(k>=1){r.mode='off';if(r.cb){const cb=r.cb;r.cb=null;cb();}}

function runCat(){
  const c=G.cat;if(c.mode!=='off')return;
  c.mode='walk';c.dir=Math.random()<0.5?1:-1;c.x=c.dir>0?-60:W+60;

}
function updateCat(dt){
  const c=G.cat;if(c.mode==='off')return;
  c.t+=dt;
  if(c.mode==='walk'){
    c.x+=c.dir*110*dt;
    if((c.dir>0&&c.x>=c.target)||(c.dir<0&&c.x<=c.target)){
      c.mode='sit';c.t=0;
      if(c.act==='knock'){const v=pick(players.filter(p=>p.active));if(v){v.chips-=15;G.pot+=15;floatText(c.x,c.y-30,'−15🪙','#ff7b7b');snd.chip();
        banner('🐈 КОТ СТАЩИЛ 15 🪙 У '+v.name+'. У КОТА ТЕПЕРЬ ФИШКА. КОТ НЕ ИЗВИНЯЕТСЯ.',22);logIt('🐈 Кот украл фишку. Это его работа теперь.');checkBankrupt();}}
      else if(c.act==='meow'){snd.meow();G.floats.push({x:c.x,y:c.y-40,txt:'МЯУ. (это было осуждающе)',color:'#ff9be8',t:0});}
      else if(c.act==='pot'){banner('🐈 КОТ СЕЛ НА БАНК. БАНК ТЕПЕРЬ КОТ. БАНК НЕ ВОЗРАЖАЕТ.',22);logIt('🐈 Банк оккупирован котом. Юристы бессильны.');}
      addChaos(5);
    }
  }else if(c.mode==='sit'){
    if(c.t>rnd(2.5,4.5)){c.mode='leave';c.t=0;}
  }else if(c.mode==='leave'){
    c.x-=c.dir*130*dt;
    if(c.x<-80||c.x>W+80)c.mode='off';
  }
}

function updateDonkey(dt){

  else if(d.mode==='hold'){if(d.t>3.4){d.mode='out';d.t=0;}}

}

function newGame(keepStats){
  G.scene='play';G.round=0;G.pot=0;G.stolenPot=0;G.phase='idle';
  G.pizzas=keepStats?G.pizzas:3;G.hints=3;G.chaos=0;G.revealAll=false;G.lastWinner=null;
  G.deck=shuffle(mkDeck());G.flying=[];G.parts=[];G.overlay=null;
  players.forEach((p,i)=>{p.cards=[];p.bet=0;p.active=true;p.acted=false;p.allin=false;p.bubble=null;
    p.chips=i===0?(keepStats?players[0].chips:120):100+Math.floor(Math.random()*60);});
  logIt('🎰 <b>ИГРА #'+G.gameNum+'</b> началась. Петух уже вылетел. Обратного билета нет.');
  banner('🐓 БЕЗУМНЫЙ ПОКЕР: ПЕТУШИНАЯ ЛИХОРАДКА',26);
  snd.fanfare();
  startRound();
}
function startRound(){
  G.round++;
  if(G.round>G.maxRounds){startShowdown();return;}
  
  // ВАЖНО: Сброс состояния игроков для нового раунда
  players.forEach(p => {
    p.active = true;
    p.cards = [];
    p.bet = 0;
    p.allin = false;
    p.acted = false;
    p.bubble = null;
  });
  G.deck = shuffle(mkDeck()); // Перетасовка колоды
  G.flying = []; // Очистка летящих карт

  G.flags={x2:false,lowball:false,whisper:false,drunk:false,tax:false,big:false,invert:false,extraRooster:false,crazySuits:false};
  G.timerMax=60;G.turtleUsed=false;G.chaosUsed=false;
  if(G.round===5&&G.stolenPot>0){
    const back=Math.floor(G.stolenPot*0.6);G.pot+=back;G.stolenPot=0;snd.coin();
    banner('🛡 Страховая «БОЛОТО» вернула '+back+' 🪙 из украденного. Остальное петух прокукарекал.',22);
    logIt('🛡 Возврат от страховой: '+back+' 🪙. Петух объявлен в розыск. Розыск ведёт тот же петух.');
  }
  G.phase='hat';G.hatT=0;G.rule=null;
  logIt('🎩 <b>РАУНД '+G.round+'</b>. Шляпа крутится... все замерли. Даже хомяк.');
}
function applyRuleAndDeal(){
  G.rule=pick(ROUND_RULES);

  logIt('🎩 ПРАВИЛО: <b>'+G.rule.text+'</b>');

  // раздача по одной карте
  let d=0;
  players.forEach((p,i)=>{

    p.cards.push(c);d+=0.16;
  });
  G.phase='deal';G.phaseT=d+0.55;

function beginBetting(){
  G.phase='bet';G.currentBet=0;
  players.forEach(p=>{p.bet=0;p.acted=false;});
  const active=players.filter(p=>p.active&&!p.allin);
  if(active.length<=1){endBetting();return;}
  let st=(G.round-1)%4,g=0;
  while(g<8&&!(players[st].active&&!players[st].allin)){st=(st+1)%4;g++;}
  G.actor=st;
  if(players[st].isHuman)G.timeLeft=G.timerMax;else G.botDelay=rnd(0.9,1.8);
}
function mult(){return G.flags.x2?2:1;}
function potTotal(){return G.pot+players.reduce((s,p)=>s+p.bet,0);}
function act(i,action){
  const p=players[i];
  if(G.phase!=='bet'||G.actor!==i||!p.active)return;
  const toCall=G.currentBet-p.bet;
  if(action==='timeout'){action=toCall>0?'fold':'pass';banner('⏰ ВРЕМЯ ВЫШЛО! '+(toCall>0?'Карты съел хомяк. Скинул за тебя.':'Авто-пас. Хомяк доволен.'),22);snd.fart();}
  if(action==='pass'){
    if(toCall>0)return;
    p.acted=true;snd.pop();
    if(!p.isHuman&&Math.random()<0.4)say(i,pick(LINES[i].pass));
    logIt('👀 <b>'+p.name+'</b>: пас.');
  }else if(action==='call'){
    const pay=Math.min(p.chips,toCall);p.chips-=pay;p.bet+=pay;
    if(p.chips===0)p.allin=true;p.acted=true;snd.chip();
    spawn(SEATS[i].x,SEATS[i].y+40,['🪙'],6,110);
    if(!p.isHuman&&Math.random()<0.5)say(i,pick(LINES[i].call));
    logIt('💜 <b>'+p.name+'</b> коллит '+pay+' 🪙.');
  }else if(action==='raise'){
    const amt=10*mult();const pay=Math.min(p.chips,toCall+amt);
    p.chips-=pay;p.bet+=pay;if(p.bet>G.currentBet)G.currentBet=p.bet;
    if(p.chips===0)p.allin=true;p.acted=true;snd.raise?0:0;snd.chip();tone(500,0.1,'square',0.07,800);
    spawn(SEATS[i].x,SEATS[i].y+40,['🪙','📈'],9,150);
    if(!p.isHuman&&Math.random()<0.6)say(i,pick(LINES[i].raise));
    logIt('📈 <b>'+p.name+'</b> РЕЙЗИТ до '+G.currentBet+' 🪙!');
  }else if(action==='allin'){
    const pay=p.chips;p.bet+=pay;p.chips=0;p.allin=true;
    if(p.bet>G.currentBet)G.currentBet=p.bet;
    p.acted=true;snd.allin();G.shake=10;
    banner('💥 '+p.name+': ОЛЛ-ИН!!!',32);
    spawn(SEATS[i].x,SEATS[i].y,['🔥','💥','🪙'],18,260);
    if(!p.isHuman)say(i,pick(LINES[i].allin));
    logIt('💥 <b>'+p.name+'</b> ВА-БАНК. Ставки сделаны, ставок больше нет, ставки ушли с петухом.');
    addChaos(6);toast('🏅 ДОСТИЖЕНИЕ: «Ва-банкер». Петух впечатлён.');
  }else if(action==='fold'){
    p.active=false;p.acted=true;snd.fart();G.shake=5;
    spawn(SEATS[i].x,SEATS[i].y+50,['🗑','💨'],8,140);
    if(!p.isHuman&&Math.random()<0.6)say(i,pick(LINES[i].fold));
    logIt('🗑 <b>'+p.name+'</b> СКИНУЛ. Карты улетели в мусорку. Мусорка не ожидала.');
    if(i===0){
      const bots=players.filter(q=>q.active&&!q.isHuman);
      if(!bots.length){finishGame([0],'ВСЕ СКИНУЛИ! Победа испугом.');return;}
      const w=pick(bots);say(w.seat,pick(LINES[w.seat].win));
      finishGame([w.seat],'🗑 Ты скинул. '+w.name+' забирает банк и гордится собой.');
      snd.lose();return;
    }
  }
  checkBankrupt();advance();
}
function allActed(){return players.every(p=>!p.active||p.acted||p.allin);}
function advance(){
  const act=players.filter(p=>p.active);
  if(act.length<=1){
    const w=act[0];
    if(w&&w.isHuman)finishGame([0],'🏆 ВСЕ СКИНУЛИ! Ты победил(а) чистым испугом.');
    else if(w)finishGame([w.seat],'Все скинули. '+w.name+' забирает банк.');
    return;
  }
  if(allActed()){endBetting();return;}
  let k=G.actor,g=0;
  do{k=(k+1)%4;g++;}while(g<8&&!(players[k].active&&!players[k].acted&&!players[k].allin));
  G.actor=k;
  if(players[k].isHuman)G.timeLeft=G.timerMax;else G.botDelay=rnd(0.8,1.7)/G.madness;
}
function botAct(i){
  const p=players[i];if(!p.active||G.phase!=='bet'||G.actor!==i)return;
  const toCall=G.currentBet-p.bet,s=handStrength(i);
  let action,line=null;
  if(Math.random()<0.22){ // абсурд
    const opts=['fold'];
    if(toCall===0)opts.push('pass');
    if(p.chips>0)opts.push('call');
    if(p.chips>toCall+10*mult())opts.push('raise');
    opts.push('allin');
    action=pick(opts);
    if(action==='fold'&&toCall===0)line='СКИНУ ПРОСТО ТАК. ПРОВЕРЯЮ РАБОТОСПОСОБНОСТЬ. (не работает)';
    else if(action==='allin'&&s<0.35)line=pick(LINES[i].allin)+' (У МЕНЯ МУСОР. НО КРАСИВЫЙ.)';
    else if(action==='raise'&&s<0.2)line='РЕЙЗ. Я ДАЖЕ НЕ СМОТРЕЛ НА КАРТЫ. ОНИ МЕНЯ БОЯТСЯ.';
  }else{
    if(toCall===0){action=(p.chips>20&&Math.random()<0.3+s*0.35)?'raise':'pass';}
    else{
      const potOdds=toCall/Math.max(1,potTotal()+toCall);
      if(s>potOdds+0.15+Math.random()*0.2)action=Math.random()<0.3?'allin':'raise';
      else if(s>potOdds-0.12||Math.random()<0.14)action='call';
      else action='fold';
    }
  }
  if(!line){const pool=LINES[i][action==='pass'?'pass':action];if(pool&&Math.random()<0.6)line=pick(pool);}
  if(line)say(i,line);
  act(i,action);
}
function endBetting(){
  G.pot+=players.reduce((s,p)=>s+p.bet,0);
  players.forEach(p=>{p.bet=0;p.acted=false;});
  G.currentBet=0;
  if(G.round>=G.maxRounds){startShowdown();return;}
  G.phase='rooster';
  const roosterActions={1:'crow',2:'egg',3:'peck',4:'steal'};
  const a=roosterActions[G.round]||'crow';
  setTimeout(()=>{
    if(G.scene!=='play')return;
    runRooster(a,()=>{if(G.scene==='play')startRound();});
  },700);
  logIt('🐓 Раунд '+G.round+' закрыт. Банк: '+G.pot+' 🪙. К столу летит ОН.');
}
function startShowdown(){
  G.phase='showdown';G.revealAll=true;snd.disco();
  runRoosterDJ();
  const results=[];
  players.forEach((p,i)=>{
    if(!p.active)return;
    const sc=evalHand(p.cards);
    results.push({p,i,score:sc});
    if(!p.isHuman)say(i,'У меня... ладно, увидите. (я нервничаю)');
  });
  results.sort((a,b)=>G.flags.lowball?cmpScore(a.score,b.score):cmpScore(b.score,a.score));
  const best=results[0].score;
  const winners=results.filter(r=>cmpScore(r.score,best)===0);
  const w0=winners[0];
  let cn=CAT_NAMES[w0.score[0]];if(w0.p.cards.some(c=>c.wild))cn+=' 🍌';
  if(G.flags.lowball)cn+=' 🙃 (LOWBALL!)';
  const total=potTotal(),share=Math.floor(total/winners.length);

/* ================= ОБНОВЛЕНИЕ ================= */
function update(dt){
  G.t+=dt;
  const ts=G.slowmo>0?0.35:1;
  const sdt=dt*ts;
  if(G.slowmo>0)G.slowmo-=dt;
  if(G.deepfry>0)G.deepfry-=dt;
  if(G.glitch>0)G.glitch-=dt;
  if(G.cheatBadge>0)G.cheatBadge-=dt;
  G.shake=Math.max(0,G.shake-dt*22);
  G.parts=G.parts.filter(pt=>{pt.life-=dt;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=(pt.grav||420)*dt;pt.rot+=pt.vr*dt;return pt.life>0;});
  G.floats=G.floats.filter(f=>{f.t+=dt;f.y-=38*dt;return f.t<1.6;});
  G.banners=G.banners.filter(b=>{b.t+=dt;return b.t<b.dur;});
  G.toasts=G.toasts.filter(t2=>{t2.t+=dt;return t2.t<3.6;});
  G.rooster.rings.forEach(r=>{});
  G.flying=G.flying.filter(f=>{
    f.t+=dt;
    if(f.t>=f.dur&&!f.done){f.done=true;snd.pop();return false;}
    return f.t<f.dur;
  });
  // график вайбов
  G.chartT-=dt;
  if(G.chartT<=0){G.chartT=0.4;G.chart.push(clamp(G.chart[G.chart.length-1]+rnd(-14,14),5,95));if(G.chart.length>36)G.chart.shift();}
  if(G.scene!=='play')return;
  // фаза шляпы
  if(G.phase==='hat'){
    G.hatT+=sdt;G.hatTick-=sdt;
    if(G.hatTick<=0){G.hatTick=0.09;snd.ratchet();}
    if(G.hatT>1.9)applyRuleAndDeal();
  }else if(G.phase==='deal'){
    G.phaseT-=sdt;
    if(G.phaseT<=0)beginBetting();
  }else if(G.phase==='bet'&&!G.overlay){
    const p=players[G.actor];
    if(p&&p.isHuman&&p.active&&!p.acted){
      G.timeLeft-=sdt;
      if(G.timeLeft<=0){act(0,'timeout');}
    }else if(p&&!p.isHuman){
      G.botDelay-=sdt;
      if(G.botDelay<=0)botAct(G.actor);
    }
  }
  updateRooster(sdt);updateCat(sdt);updateDonkey(sdt);
  // планировщики безумия
  G.catTimer-=sdt*G.madness;if(G.catTimer<=0){G.catTimer=rnd(13,22)/G.madness;if(G.phase!=='over')runCat();}
  G.donkeyTimer-=sdt*G.madness;if(G.donkeyTimer<=0){G.donkeyTimer=rnd(16,26)/G.madness;if(G.phase!=='over')runDonkey();}
  G.nonsenseTimer-=sdt;if(G.nonsenseTimer<=0){G.nonsenseTimer=rnd(7,13);
    if(G.phase==='bet'||G.phase==='rooster'){const b=pick(players.filter(p=>!p.isHuman));if(!b.bubble||b.bubble.until<G.t)say(b.seat,pick(NONSENSE));}}
  // реклама
  if(!G.ad){G.adNext-=sdt;if(G.adNext<=0&&G.phase!=='over'){G.adNext=rnd(17,30)/G.madness;spawnAd();}}
  else{G.ad.t+=dt;if(G.ad.t>9)G.ad=null;}
  // случайный глитч для какофонии
  if(Math.random()<0.004*G.madness){G.glitch=Math.max(G.glitch,0.7);snd.glitch();}
}

/* ================= РИСОВАНИЕ: ХЕЛПЕРЫ ================= */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function nt(txt,x,y,size,color,opt={}){
  ctx.save();
  ctx.font=(opt.mono?'"Rubik Mono One"':'"Russo One"')+',sans-serif';
  ctx.font=size+'px '+ctx.font.split('px ')[1];
  if(opt.rot){ctx.translate(x,y);ctx.rotate(opt.rot);x=0;y=0;}
  ctx.textAlign=opt.align||'center';ctx.textBaseline=opt.base||'middle';
  if(opt.alpha!==undefined)ctx.globalAlpha=opt.alpha;
  if(opt.glow!==false){ctx.shadowColor=color;ctx.shadowBlur=opt.glowSize||10;}
  if(opt.stroke){ctx.lineWidth=opt.strokeW||4;ctx.strokeStyle=opt.stroke;ctx.strokeText(txt,x,y);}
  ctx.fillStyle=color;ctx.fillText(txt,x,y);
  ctx.restore();
}
function wrapTxt(text,maxW,size){
  ctx.font=size+'px "Russo One",sans-serif';
  const words=String(text).split(' '),lines=[];let cur='';
  for(const w of words){const t2=cur?cur+' '+w:w;if(ctx.measureText(t2).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t2;}
  if(cur)lines.push(cur);return lines;
}
function uib(x,y,w,h,label,fill,onClick,opt={}){
  const hov=mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
  const en=opt.disabled!==true;
  if(en)HIT.push({x,y,w,h,onClick});
  ctx.save();
  if(en&&hov){ctx.translate(x+w/2,y+h/2);ctx.scale(1.07,1.07);ctx.translate(-(x+w/2),-(y+h/2));}
  let p2=opt.pulse?(0.7+0.3*Math.sin(G.t*8)):1;
  ctx.globalAlpha=en?1:0.45;
  rr(x,y+5,w,h,12);ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fill();
  rr(x,y,w,h,12);
  if(opt.rainbow){const g=ctx.createLinearGradient(x,y,x+w,y+h);

    ctx.beginPath();ctx.moveTo(headX+7,headY+1);ctx.lineTo(headX+20,headY-2);ctx.lineTo(headX+7,headY+6);ctx.closePath();ctx.fill();}
  else{ctx.beginPath();ctx.moveTo(headX+7,headY-2);ctx.lineTo(headX+17,headY+1);ctx.lineTo(headX+7,headY+4);ctx.closePath();ctx.fill();}

    '3. Действия: ПАС / КОЛЛ / РЕЙЗ +10 / ОЛЛ-ИН / СКИНУТЬ (это фолд, но смешнее).',
    '4. 🐓 ПЕТУХ прилетает каждый раунд. Раунд 1 — кукарекает (налог). Раунд 2 — несёт золотое яйцо. Раунд 3 — клюёт карту в банан 🍌 (дикая карта!). Раунд 4 — КРАДЁТ БАНК И УЛЕТАЕТ. Раунд 5 — диджей на шоу-дауне.',
    '5. 🐈 Кот ворует фишки. 🫏 Осёл кидает пиццу. Не вопрошай.',
    '6. 🍕 Пицца — валюта читов (😈). Петух осуждает, но уважает.',
    '7. ⏱ 60 секунд на решение. Не успел — хомяк съел твои карты.',
    '8. 🐢 Черепаха замедляет время. Один раз за раунд. Черепаха старается.',
    '9. Банкросство отменяется: кончились вайбы — дадим ещё. Это не кредит. Это кредит (📉 долг растёт).',
    '10. Шкала ХАОСА справа: заполнится — будет МЕГА-ХАОС. Или не будет. Она сама решает.',
    '11. Администрация, петух, кот и осёл не несут ответственности за ваши вайбы, рассудок и мебель.'
  ];
  rules.forEach((r,i)=>{
    const ls=wrapTxt(r,600,11);
    ls.forEach((l,li)=>nt(l,W/2-300,96+i*40+li*14,11,i%2?'#d8cdf0':'#ffd76a',{align:'left',glow:false}));
  });
  uib(W/2-90,540,180,40,'ЗАКРЫТЬ','#ff2e88',()=>{G.overlay=null;if(G.phase==='idle'&&G.scene==='play')G.scene='title';},{size:14,textColor:'#fff'});
}
function drawLogPanel(){
  panel(W/2-320,50,640,540,'#39ff14','📋 ЧТО ПРОИСХОДИТ');
  const entries=G.log.slice(0,16);
  let y=88;
  entries.forEach(e=>{
    const ls=wrapTxt(e.replace(/<[^>]+>/g,''),590,11);
    ls.forEach((l,li)=>{nt(l,W/2-290,y+li*14,11,li===0?'#d8f0c8':'#9bb89a',{align:'left',glow:false});});
    y+=ls.length*14+8;
  });
  if(!entries.length)nt('Пока ничего не произошло. Подозрительно тихо...',W/2,200,13,'#8a7ab0',{glow:false});
  uib(W/2-90,540,180,40,'ЗАКРЫТЬ','#ff2e88',()=>{G.overlay=null;},{size:14,textColor:'#fff'});
}
function drawCheatsPanel(){
  panel(W/2-300,70,600,500,'#ff2e88','😈 ЧИТЫ (за 🍕)');
  nt('У тебя: '+G.pizzas+' 🍕. Осёл смотрит на твой кошелёк.',W/2,108,12,'#ff9be8',{glow:false});
  CHEATS.forEach((c,i)=>{
    const y=130+i*58;
    rr(W/2-270,y,540,50,10);ctx.fillStyle='rgba(36,16,64,0.8)';ctx.fill();
    ctx.strokeStyle=G.pizzas>=c.cost?'#ff2e88':'#3a2a55';ctx.lineWidth=2;ctx.stroke();
    nt(c.name,W/2-140,y+17,14,G.pizzas>=c.cost?'#ffe14d':'#5a4a75',{align:'center',glow:false});
    nt(c.desc,W/2-10,y+36,10,'#9b8ac0',{align:'center',glow:false});
    uib(W/2+180,y+8,80,34,c.cost+' 🍕',G.pizzas>=c.cost?'#39ff14':'#332b44',()=>useCheat(i),{disabled:G.pizzas<c.cost,size:13});
  });
  uib(W/2-90,522,180,40,'ЗАКРЫТЬ','#00fff7',()=>{G.overlay=null;},{size:14});
}
function drawPostFX(){
  // сканлайны
  ctx.save();ctx.globalAlpha=0.06;ctx.fillStyle='#000';
  for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
  ctx.restore();
  // глитч
  if(G.glitch>0){
    for(let k=0;k<6;k++){
      const sy=Math.random()*H,sh=5+Math.random()*26,dx=(Math.random()-0.5)*36;
      try{ctx.drawImage(cv,0,sy,W,sh,dx,sy,W,sh);}catch(e){}
    }
    ctx.globalAlpha=0.07;ctx.fillStyle=pick(['#ff2e88','#00fff7','#39ff14']);ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
    if(Math.random()<0.2)nt(pick(['ERROR','ПОМОГИТЕ','null','ᓭᐧᐸ','01001000','КУ-КА-РЕ-КУ','undefined']),Math.random()*W,Math.random()*H,24,'rgba(0,255,247,0.5)',{align:'left',mono:true});
  }
  // слоу-мо тонировка
  if(G.slowmo>0){ctx.save();ctx.globalAlpha=0.08;ctx.fillStyle='#00a0ff';ctx.fillRect(0,0,W,H);ctx.restore();
    nt('🐢 S L O W - M O',W/2,H/2-140,16,'rgba(155,232,255,0.6)',{glow:false});}
  // виньетка
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*0.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

/* ================= ГЛАВНЫЙ РЕНДЕР ================= */
function draw(){
  HIT.length=0;
  const now=G.t;
  let filt=[];
  if(G.deepfry>0)filt.push('saturate(3.2) contrast(1.45) hue-rotate('+((now*70)%360).toFixed(0)+'deg)');
  if(G.flags.invert&&G.scene==='play')filt.push('invert(1) hue-rotate(180deg)');
  if(G.flags.whisper&&G.scene==='play')filt.push('brightness(0.72)');
  cv.style.filter=filt.join(' ')||'none';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  drawBg();
  if(G.scene==='title'){
    drawTopBarMinimal();
    drawOverlays();drawBanners();drawPostFX();
    cv.style.cursor='default';return;
  }
  ctx.save();
  if(G.shake>0)ctx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));
  if(G.flags.drunk){ctx.translate(W/2,H/2);ctx.rotate(Math.sin(now*1.4)*0.014);ctx.translate(-W/2,-H/2);}
  drawTable();
  drawHatZone();
  drawPot();
  drawSeats();
  drawPlayerZone();
  drawFlying();
  // кот
  if(G.cat.mode!=='off')drawCatSprite(G.cat.x,G.cat.y,now,G.cat.mode==='sit',G.cat.dir>0?1:-1);
  // осёл
  drawDonkeySprite(G.donkey.side,G.donkey.peek,now,G.donkey.line,G.donkey.pizza);
  // петух
  const r=G.rooster;
  if(r.mode!=='off')drawRoosterSprite(r.x,r.y,1.15,r.flap,r.mode==='enter'||r.mode==='exit'?'enter':(r.mode==='dj'?'dj':(r.mode==='act'?'act':'enter')),r.bag);
  // частицы
  G.parts.forEach(pt=>{
    ctx.save();ctx.globalAlpha=clamp(pt.life,0,1);ctx.translate(pt.x,pt.y);ctx.rotate(pt.rot);
    ctx.font=pt.size+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(pt.emoji,0,0);ctx.restore();
  });
  // всплывающий текст
  G.floats.forEach(f=>{
    nt(f.txt,f.x,f.y,14,f.color,{alpha:clamp(1.6-f.t,0,1),stroke:'#000',strokeW:3});
  });
  ctx.restore();
  drawTicker();
  drawTopBar();
  drawActionButtons();
  drawBanners();
  drawAd();
  drawToasts();
  drawCheatBadge();
  drawOverlays();
  drawPostFX();
  // курсор
  let hovBtn=false;
  for(const b of HIT){if(mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h)hovBtn=true;}
  cv.style.cursor=hovBtn?'pointer':'default';
}
function drawTopBarMinimal(){
  ctx.save();
  ctx.fillStyle='rgba(8,2,18,0.9)';ctx.fillRect(0,0,W,56);
  ctx.strokeStyle='#ff2e88';ctx.lineWidth=2;ctx.shadowColor='#ff2e88';ctx.shadowBlur=10;
  ctx.beginPath();ctx.moveTo(0,56);ctx.lineTo(W,56);ctx.stroke();ctx.shadowBlur=0;
  nt('🃏 v6.6.6 «ПЕТУХ»',120,28,12,'#8a7ab0',{align:'left',glow:false});
  ctx.restore();
  iconBtn(W-64,8,40,'❓',()=>{G.overlay=G.overlay==='rules'?null:'rules';});
  iconBtn(W-108,8,40,muted?'🔇':'🔊',()=>{muted=!muted;});
}

/* ================= ВВОД ================= */
function evPos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
cv.addEventListener('pointermove',e=>{mouse=evPos(e);});
cv.addEventListener('pointerleave',()=>{mouse={x:-99,y:-99};});
cv.addEventListener('pointerdown',e=>{
  const p=evPos(e);mouse=p;
  for(let i=HIT.length-1;i>=0;i--){
    const b=HIT[i];
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){
      try{snd.pop();b.onClick();}catch(err){}
      return;
    }
  }
  // клик мимо — мини-реакция
  if(G.scene==='play'&&Math.random()<0.3){
    spawn(p.x,p.y,['✨','💢'],3,80,200);
    if(Math.random()<0.2){const b=pick(players.filter(q=>!q.isHuman));say(b.seat,'НЕ ТЫКАЙ В СТОЛ. СТОЛ ДОРОГОЙ.');}
  }
});
window.addEventListener('keydown',e=>{
  if(G.scene!=='play'||G.overlay)return;
  const k=e.key.toLowerCase();
  if(k==='1')act(0,'pass');
  else if(k==='2'){const p=players[0];if(G.currentBet-p.bet>0)act(0,'call');}
  else if(k==='3')act(0,'raise');
  else if(k==='4'){say(0,'ААААА ВА-БАНК!!!');act(0,'allin');}
  else if(k==='5')act(0,'fold');
  else if(k==='h'||k==='р')useHint();
  else if(k==='t'||k==='е')useTurtle();
  else if(k==='c'||k==='с')chaosButton();
});

/* ================= ЦИКЛ ================= */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
  update(dt);draw();
  requestAnimationFrame(frame);
}
logIt('🐓 Система загружена. Петух в пути. Осёл уже тут. Кот тоже. Ты — последний.');
requestAnimationFrame(frame);
</script>
</body>
